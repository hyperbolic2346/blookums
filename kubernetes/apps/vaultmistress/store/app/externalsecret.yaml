---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultmistress
  namespace: vaultmistress
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: vaultmistress-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        WORDPRESS_DB_HOST: percona-xtradb-haproxy.databases.svc.cluster.local
        WORDPRESS_DB_USER: vaultmistress
        WORDPRESS_DB_PASSWORD: "{{ .WORDPRESS_DB_PASSWORD }}"
        WORDPRESS_DB_NAME: vaultmistress
  data:
    - secretKey: WORDPRESS_DB_PASSWORD
      remoteRef:
        key: vaultmistress
        property: WORDPRESS_DB_PASSWORD
