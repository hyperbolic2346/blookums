---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vaultmistress
  namespace: vaultmistress
spec:
  dependsOn:
    - name: percona-xtradb-cluster
      namespace: databases
    - name: external-secrets-stores
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
  components:
    - ../../../../components/volsync
  path: ./kubernetes/apps/vaultmistress/store/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  # First boot pulls the WooCommerce zip before Apache starts; 5m is tight.
  timeout: 10m
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: cluster-settings
        kind: ConfigMap
    substitute:
      APP: vaultmistress
      VOLSYNC_CLAIM: vaultmistress-data
      VOLSYNC_SNAPSHOTCLASS: csi-ceph-block
      # Product photography is the bulk of this; blogs get 2Gi, a catalogue needs more.
      VOLSYNC_CAPACITY: 10Gi
      # wp-content is owned by www-data, so the restic mover must restore as 33
      # rather than the component's 568 default.
      APP_UID: "33"
      APP_GID: "33"
