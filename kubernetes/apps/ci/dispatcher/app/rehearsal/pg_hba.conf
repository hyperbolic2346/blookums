# The rehearsal pod's own Postgres, holding the copy of production. The
# copy step (superuser) reaches it only over the socket shared with the
# postgres container; the app containers reach it over 127.0.0.1 as the
# unprivileged owner of the copy, as production's app role does. Nothing
# else is accepted, and the server listens on 127.0.0.1 only.
# TYPE  DATABASE  USER       ADDRESS        METHOD
local   all       postgres                  trust
host    all       stockpile  127.0.0.1/32   scram-sha-256
