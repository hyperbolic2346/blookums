# The rehearsal pod's own Postgres, holding the copy of production. The
# copy step (superuser) reaches it only over the socket shared with the
# postgres container; the app containers reach it over 127.0.0.1 as the
# unprivileged owner of the copy, as production's app role does. Nothing
# else is accepted, and the server listens on 127.0.0.1 only. The public api
# steps log in as the restricted storefront_public role with no password: only
# this pod can reach the server, and everything in it can already log in as the
# owner, who can read more, so a password there would protect nothing.
# TYPE  DATABASE  USER       ADDRESS        METHOD
local   all       postgres                  trust
host    all       stockpile  127.0.0.1/32   scram-sha-256
host    all       storefront_public  127.0.0.1/32   trust
