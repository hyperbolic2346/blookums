---
# The dispatcher manages build and rehearsal Jobs and its own state
# ConfigMap in this namespace, reads their pods and logs, reads the
# PodTemplates, and keeps rehearsal requests and its rehearsal queue as
# ConfigMaps it lists and deletes. Outside the namespace it may only read
# the stockpile-api Deployment, for the image a rehearsal boots as the
# deployed release (batcave/stockpile/app/rbac-ci.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatcher
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["podtemplates"]
    resourceNames: ["build-trusted", "build-untrusted", "rehearsal-stockpile"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "list", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["dispatcher-state"]
    verbs: ["get", "update"]
  # Whether the rehearsal's credentials have synced, before starting one
  # (the Secrets themselves are not readable).
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    resourceNames: ["ci-rehearsal-db", "ci-registry-pull"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dispatcher
subjects:
  - kind: ServiceAccount
    name: dispatcher
---
# Build and rehearsal pods run under this account. It has no role
# bindings, and its token is not mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-build
automountServiceAccountToken: false
