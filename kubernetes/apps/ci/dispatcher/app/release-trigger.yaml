---
# Stockpile's nightly release (stockpile#334, #728): at 00:30 New York time,
# dispatch the stockpile `release` workflow on main with nightly=true. The
# workflow tags main's head only if its cluster build and rehearsal are
# green, and holds a nightly run to 00:00-05:00 New York, so a late start
# never tags (= deploys prod) in the daytime. GitHub's own cron was hours
# late the first night and never ran the second, hence this.
#
# Token: secret ci-release-dispatch (externalsecret.yaml), a fine-grained
# token on NerdbucketInc/stockpile with only "Actions: read and write".
# Until it exists the job fails with a message and CiReleaseTriggerFailed
# fires; nothing else depends on it.
#
# Run it at once (keep the stockpile-release-trigger- prefix so
# CiReleaseTriggerFailed sees it; bump the number each time):
#   KUBECONFIG=C:/Users/knobb/code/blookums/kubeconfig kubectl -n ci create job --from=cronjob/stockpile-release-trigger stockpile-release-trigger-manual-1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stockpile-release-trigger
spec:
  schedule: "30 0 * * *"
  timeZone: America/New_York
  # A start the controller missed still runs if it's within the hour (still
  # inside the release window); later than that, the night is skipped.
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # Counts from the Job's start: room to pull the image on a node that
      # doesn't have it, plus the retries (about 3 minutes at worst).
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stockpile-release-trigger
            app.kubernetes.io/component: release-trigger
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dispatch
              # The dispatcher's image (fetch is built in; no other tools).
              image: docker.io/library/node:26.13.0-bookworm@sha256:fa52d1669505e29b58c042875b1d65c229e0787a3610fd52869b22b68e480853
              command: ["node", "-e"]
              args:
                - |
                  const token = (process.env.DISPATCH_TOKEN || "").trim();
                  if (!token) {
                    console.error("No token: add release_dispatch_token to the 1Password item ci (Actions read/write on NerdbucketInc/stockpile).");
                    process.exit(1);
                  }
                  const url = "https://api.github.com/repos/NerdbucketInc/stockpile/actions/workflows/release.yaml/dispatches";
                  const body = JSON.stringify({ ref: "main", inputs: { nightly: "true" } });
                  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
                  (async () => {
                    // A dispatch is safe to resend: the workflow's concurrency
                    // group queues a second run, which then finds nothing new.
                    for (let attempt = 1; attempt <= 4; attempt++) {
                      let status = 0, text = "";
                      try {
                        const res = await fetch(url, {
                          method: "POST",
                          headers: {
                            Authorization: "Bearer " + token,
                            Accept: "application/vnd.github+json",
                            "X-GitHub-Api-Version": "2022-11-28",
                            "User-Agent": "blookums-stockpile-release-trigger",
                            "Content-Type": "application/json",
                          },
                          body,
                          signal: AbortSignal.timeout(20000),
                        });
                        status = res.status;
                        text = (await res.text()).slice(0, 300);
                      } catch (err) {
                        // "fetch failed" alone says nothing: add the cause's code.
                        text = String(err && err.message) + (err && err.cause && err.cause.code ? " (" + err.cause.code + ")" : "");
                      }
                      if (status >= 200 && status < 300) {
                        console.log("Dispatched stockpile release (nightly) on main.");
                        return;
                      }
                      console.error("Attempt " + attempt + ": HTTP " + (status || "no answer") + " " + text);
                      // A definite refusal (bad token, unknown input) won't change.
                      if (status >= 400 && status < 500 && status !== 429) break;
                      if (attempt < 4) await sleep(attempt * 15000);
                    }
                    process.exitCode = 1;
                  })();
              env:
                - name: DISPATCH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ci-release-dispatch
                      key: token
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
