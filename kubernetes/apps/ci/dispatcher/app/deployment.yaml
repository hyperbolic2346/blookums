---
# The build dispatcher (dispatcher.mjs, settings in config.json). One
# replica: it is the only writer of the build queue and counter.
#
# Secrets are mounted optional. Until their 1Password items exist the
# dispatcher runs idle: without a deploy key a repository is not fetched,
# and without a webhook secret every webhook for it is refused.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  labels:
    app.kubernetes.io/name: dispatcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatcher
    spec:
      serviceAccountName: dispatcher
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: dispatcher
          # The full image, for git and ssh.
          image: docker.io/library/node:24.21.0-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
          command: ["node", "/app/dispatcher.mjs"]
          env:
            - name: CONFIG_PATH
              value: /app/config.json
            - name: LOG_BASE_URL
              value: https://ci.${SECRET_DOMAIN}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          ports:
            - name: hooks
              containerPort: 8080
            - name: logs
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: hooks
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: logs
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: work
              mountPath: /work
            - name: logs
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: webhook-secrets
              mountPath: /secrets/hooks
              readOnly: true
            - name: deploy-keys
              mountPath: /secrets/deploy-keys
              readOnly: true
            - name: github-status
              mountPath: /secrets/github
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: dispatcher
        - name: work
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: logs
          persistentVolumeClaim:
            claimName: ci-dispatcher-logs
        - name: webhook-secrets
          secret:
            secretName: ci-webhooks
            optional: true
            defaultMode: 0440
        - name: deploy-keys
          secret:
            secretName: ci-deploy-keys
            optional: true
            defaultMode: 0440
        - name: github-status
          secret:
            secretName: ci-github-status
            optional: true
            defaultMode: 0440
---
# Webhook endpoint, published on the external gateway (httproute.yaml).
apiVersion: v1
kind: Service
metadata:
  name: dispatcher-hooks
  labels:
    app.kubernetes.io/name: dispatcher
spec:
  selector:
    app.kubernetes.io/name: dispatcher
  ports:
    - name: http
      port: 80
      targetPort: hooks
---
# Build log pages, published on the internal gateway only.
apiVersion: v1
kind: Service
metadata:
  name: dispatcher-logs
  labels:
    app.kubernetes.io/name: dispatcher
spec:
  selector:
    app.kubernetes.io/name: dispatcher
  ports:
    - name: http
      port: 80
      targetPort: logs
