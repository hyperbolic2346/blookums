---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/common-3.1.0/charts/library/common/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sandstorm
  namespace: gaming
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: sandstorm
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      main:
        initContainers:
          heal-steam:
            image:
              repository: "docker.io/andrewmhub/insurgency-sandstorm"
              tag: lite
            command:
              - /opt/heal/heal-steam.sh
        containers:
          main:
            image:
              repository: "docker.io/andrewmhub/insurgency-sandstorm"
              tag: lite # I wish this wasn't how it's tagged, but alas
            # Self-heal on every container start (initContainers only run on pod
            # creation). SteamCMD delta updates need the *old* depot manifest,
            # which anonymous logins can no longer fetch ("Access Denied"),
            # leaving app 581330 stuck at state 0x6. On failure, drop the app
            # manifest/staging so SteamCMD validates against the new build.
            # Game files, configs and saves are kept. $$ escapes Flux substitution.
            command: ["/bin/bash", "-c"]
            args:
              - |
                G=/home/steam/steamcmd/sandstorm
                upd() { /home/steam/steamcmd/steamcmd.sh +force_install_dir "$${G}/" +login anonymous +app_update 581330 validate +quit; }
                if ! upd; then
                  echo "[heal] app_update failed; clearing appmanifest_581330.acf and retrying with validate"
                  rm -rf "$${G}/steamapps/appmanifest_581330.acf" "$${G}/steamapps/downloading" "$${G}/steamapps/temp"
                  upd || exit 8
                fi
                exec "$${G}/Insurgency/Binaries/Linux/InsurgencyServer-Linux-Shipping" $${LAUNCH_SERVER_ENV} -hostname="$${HOSTNAME}" -Port=$${PORT} -QueryPort=$${QUERYPORT}
            env:
              TZ: ${TIMEZONE}
              PORT: "27102"
              QUERYPORT: "27131"
              HOSTNAME: "Minion Sandstorm"
              LAUNCH_SERVER_ENV: "LAUNCH_SERVER_ENV=Ministry?Scenario=Scenario_Ministry_Checkpoint_Security?Game=Checkpoint?password=${SECRET_SANDSTORM_PW}?MaxPlayers=8 -MapCycle=MapCycle -Mods -ModList=Mods.txt -mutators=${SECRET_SANDSTORM_MUTATORS} -GameStatsToken=${SECRET_SANDSTORM_STATSTOKEN} -GameStats -GSLTToken=${SECRET_SANDSTORM_GSLT_TOKEN} -ModDownloadTravelTo=Ministry?Scenario=Scenario_Ministry_Checkpoint_Security"
            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
              limits:
                cpu: 3000m
                memory: 6Gi

    service:
      main:
        controller: main
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        ports:
          gameudp:
            enabled: true
            port: 27102
            protocol: UDP
          queryudp:
            enabled: true
            port: 27131
            protocol: UDP
    persistence:
      game:
        enabled: true
        type: persistentVolumeClaim
        advancedMounts:
          main:
            main:
              - path: /home/steam/steamcmd/sandstorm
            heal-steam:
              - path: /home/steam/steamcmd/sandstorm
        existingClaim: sandstorm-data
      healscript:
        enabled: true
        type: configMap
        name: insurgency-sandstorm-heal-script
        defaultMode: 0755
        advancedMounts:
          main:
            heal-steam:
              - subPath: heal-steam.sh
                path: /opt/heal/heal-steam.sh
      gameini:
        enabled: true
        type: configMap
        name: insurgency-sandstorm-gameini
        advancedMounts:
          main:
            main:
              - subPath: Game.ini
                path: /home/steam/steamcmd/sandstorm/Insurgency/Saved/Config/LinuxServer/Game.ini
        defaultMode: 0777
      engineini:
        enabled: true
        type: configMap
        name: insurgency-sandstorm-engineini
        advancedMounts:
          main:
            main:
              - subPath: Engine.ini
                path: /home/steam/steamcmd/sandstorm/Insurgency/Saved/Config/LinuxServer/Engine.ini
        defaultMode: 0777
      gameusersettingsini:
        enabled: true
        type: secret
        name: insurgency-sandstorm-gameusersettingsini
        advancedMounts:
          main:
            main:
              - subPath: GameUserSettings.ini
                path: /home/steam/steamcmd/sandstorm/Insurgency/Saved/Config/LinuxServer/GameUserSettings.ini
        defaultMode: 0777
      adminstxt:
        enabled: true
        type: secret
        name: insurgency-sandstorm-adminstxt
        advancedMounts:
          main:
            main:
              - subPath: Admins.txt
                path: /home/steam/steamcmd/sandstorm/Insurgency/Config/Server/Admins.txt
        defaultMode: 0777
      mapcycletxt:
        enabled: true
        type: configMap
        name: insurgency-sandstorm-mapcycletxt
        advancedMounts:
          main:
            main:
              - subPath: MapCycle.txt
                path: /home/steam/steamcmd/sandstorm/Insurgency/Config/Server/MapCycle.txt
        defaultMode: 0777
      modstxt:
        enabled: true
        type: configMap
        name: insurgency-sandstorm-modstxt
        advancedMounts:
          main:
            main:
              - subPath: Mods.txt
                path: /home/steam/steamcmd/sandstorm/Insurgency/Config/Server/Mods.txt
        defaultMode: 0777
