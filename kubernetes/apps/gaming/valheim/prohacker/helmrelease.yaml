---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name prohacker-valheim
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: prohacker-valheim
  install:
    replace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    cleanupOnFail: true
  uninstall:
    keepHistory: false

  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            nameOverride: *name
            image:
              repository: docker.io/mbround18/valheim
              tag: 3.8.8@sha256:374b5e34ba17d6e98cdbf674b5da764b116a2e64bcadb3bd629d8c4e4c921c7e
              pullPolicy: IfNotPresent
            env:
              PORT: "2456"
              PUBLIC: "1"
              NAME: "Prohacker"
              WORLD: "Prohacker"
              PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: prohacker-valheim-secret
                    key: password
              TZ: ${TIMEZONE}
            resources:
              requests:
                memory: 4Gi
                cpu: 1000m
              limits:
                memory: 10Gi

    service:
      main:
        controller: main
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        # Public AT&T static IP from pool-public (BGP-advertised, no port
        # forward needed). Reachable at prohacker.burntsheep.com:2456 via the
        # DNSEndpoint in this directory.
        labels:
          io.cilium/lb-public: "true"
        annotations:
          io.cilium/lb-ipam-ips: "99.136.248.253"
        ports:
          steam1:
            port: 2456
            protocol: UDP
          steam2:
            port: 2457
            protocol: UDP

    persistence:
      data:
        existingClaim: prohacker-valheim-data
        globalMounts:
          - path: /home/steam/.config/unity3d/IronGate/Valheim/
          - path: /home/steam/valheim/
          - path: /home/steam/backups/
