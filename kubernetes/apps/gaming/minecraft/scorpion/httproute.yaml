---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scorpion
spec:
  hostnames: ["scorpion.${SECRET_DOMAIN}"]
  parentRefs:
    # PUBLIC AND UNAUTHENTICATED. The tunnel routes *.burntsheep.com to
    # cilium-gateway-external and a wildcard DNS record already exists, so
    # attaching here puts the map on the open internet. There is deliberately
    # no Cloudflare Access policy on this hostname: anyone who knows the name
    # can see the world map and live player positions/usernames. Add one in
    # Cloudflare (not in this repo) if that ever stops being acceptable.
    - name: external
      namespace: kube-system
      port: 443
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: scorpion-minecraft-scorpiondynmap
          namespace: gaming
          port: 8123
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
