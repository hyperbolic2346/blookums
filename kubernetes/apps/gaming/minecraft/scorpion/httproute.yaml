---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scorpion
spec:
  hostnames: ["scorpion.${SECRET_DOMAIN}"]
  parentRefs:
    # NOTE: internal while we validate the dynmap hardening. To publish this map
    # to the internet, change this to `external` -- the tunnel already routes
    # *.burntsheep.com to cilium-gateway-external and a wildcard DNS record
    # already exists, so that one word is the entire cutover. Put a Cloudflare
    # Access policy on the hostname BEFORE flipping it.
    - name: internal
      namespace: kube-system
      port: 443
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: scorpion-minecraft-scorpiondynmap
          namespace: gaming
          port: 8123
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
