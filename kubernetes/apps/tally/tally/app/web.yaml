---
# The game: the Unity WebGL player behind nginx. Image: ghcr.io/hyperbolic2346/tally-web
# (repo: tally, deploy/publish.sh, which stages Builds/WebGL into the image).
#
# Entirely static, no database, no secrets. The player talks to tally-api.nerdbucket.org from
# the browser, so the API's CORS_ORIGINS has to name https://tally.nerdbucket.org.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tally-web
  namespace: tally
  labels: &labels
    app.kubernetes.io/name: tally
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      imagePullSecrets:
        - name: tally-ghcr-pull
      containers:
        - name: nginx
          image: ghcr.io/hyperbolic2346/tally-web:0.1.0
          ports:
            - name: http
              containerPort: 8080
          livenessProbe: &probe
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 2
          readinessProbe: *probe
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: tally-web
  namespace: tally
spec:
  selector:
    app.kubernetes.io/name: tally
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tally-web
  namespace: tally
spec:
  parentRefs:
    - name: external
      namespace: kube-system
      sectionName: https-sutler
  hostnames: ["tally.nerdbucket.org"]
  rules:
    - backendRefs:
        - name: tally-web
          port: 80
