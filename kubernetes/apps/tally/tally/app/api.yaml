---
# The Tally API. Image: ghcr.io/hyperbolic2346/tally-server (repo: tally-server, deploy/publish.sh).
#
# Database: no Postgres of its own. It gets a database and a role on the shared CloudNativePG
# cluster in the `databases` namespace, created by the postgres-init init container, exactly the
# way Stockpile does (kubernetes/apps/batcave/stockpile/app/helmrelease.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tally-api
  namespace: tally
  labels: &labels
    app.kubernetes.io/name: tally
    app.kubernetes.io/component: api
  annotations:
    # Roll the pods when the ExternalSecret rewrites tally-secret.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # `prisma migrate deploy` runs in an init container; Recreate keeps exactly one migrator
  # running across a rollout.
  # Rolling, with the old pod kept until the new one is Ready: a missing or broken image must
  # never take the API down (Recreate did exactly that for ten hours on 2026-10-02).
  # Migrations are additive, so old and new can overlap briefly.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      imagePullSecrets:
        - name: tally-ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        # 1) create the tally database + role on the shared cluster
        - name: 01-init-db
          image: ghcr.io/home-operations/postgres-init:18.7
          # Database init credentials are mounted here and nowhere else.
          envFrom:
            - secretRef:
                name: tally-db-init
          securityContext: &hardened
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # 2) apply the Prisma migrations before anything serves
        - name: 02-migrate
          image: &apiImage ghcr.io/hyperbolic2346/tally-server:0.4.1
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom: &envFrom
            - secretRef:
                name: tally-secret
          securityContext: *hardened
      containers:
        - name: api
          image: *apiImage
          # The image's own CMD is `prisma migrate deploy && node dist/main.js`; migrations have
          # already run in the init chain, so go straight to the server.
          command: ["node", "dist/main.js"]
          ports:
            - name: http
              containerPort: 3080
          envFrom: *envFrom
          livenessProbe: &probe
            httpGet:
              # Deliberately does not touch the database, so it answers during a database blip.
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe: *probe
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext: *hardened
---
apiVersion: v1
kind: Service
metadata:
  name: tally-api
  namespace: tally
spec:
  selector:
    app.kubernetes.io/name: tally
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tally-api
  namespace: tally
spec:
  parentRefs:
    - name: external
      namespace: kube-system
      # The listener for this app's domain (not the cluster's default one).
      sectionName: https-sutler
  hostnames: ["tally-api.${SECRET_DOMAIN_SUTLER}"]
  rules:
    - backendRefs:
        - name: tally-api
          port: 80
---
# Retention purge report, weekly. Rules and floors live in the server (tally-server
# src/common/retention.ts): a student idle 13 months loses their save, history and picture
# (the roster name stays); a class nobody has played in for 18 months is deleted, after the
# dashboard has shown its teacher a warning for 60 days; daily rows older than a year go.
#
# REPORT ONLY: it deletes nothing. Every Monday morning (US time) it works out what is old
# enough to delete and, when there is anything, sends it to the phone through Alertmanager
# (--notify posts a 30-minute warning alert "TallyRetentionReport"; the cluster's Pushover
# routing delivers it; Tally holds no notification token). The same report is in the job log:
#   kubectl -n tally logs job/<name>
# To act on a report:
#   kubectl -n tally exec deploy/tally-api -c api -- node dist/admin/cli.js purge --apply
# or add "--apply" to the command below to delete every week without asking. Nothing can come
# due before autumn 2027 (the oldest class dates from September 2026).
#
# The image must be the API's: it shares the database schema. It is the same string as
# &apiImage above, so a tag bump that replaces the tag everywhere in this file keeps them in
# step (YAML anchors do not reach across documents).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tally-purge
  namespace: tally
  labels:
    app.kubernetes.io/name: tally
    app.kubernetes.io/component: purge
spec:
  schedule: "17 15 * * 1" # Mondays 15:17 UTC: mid-morning Eastern, since it can page a phone
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 2419200 # keep each week's log for four weeks
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tally
            app.kubernetes.io/component: purge
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: tally-ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: purge
              image: ghcr.io/hyperbolic2346/tally-server:0.4.1
              command: ["node", "dist/admin/cli.js", "purge", "--notify"]
              env:
                - name: ALERTMANAGER_URL
                  value: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
              envFrom:
                - secretRef:
                    name: tally-secret
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
                limits:
                  memory: 384Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
