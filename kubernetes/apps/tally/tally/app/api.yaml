---
# The Tally API. Image: ghcr.io/hyperbolic2346/tally-server (repo: tally-server, deploy/publish.sh).
#
# Database: no Postgres of its own. It gets a database and a role on the shared CloudNativePG
# cluster in the `databases` namespace, created by the postgres-init init container, exactly the
# way Stockpile does (kubernetes/apps/batcave/stockpile/app/helmrelease.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tally-api
  namespace: tally
  labels: &labels
    app.kubernetes.io/name: tally
    app.kubernetes.io/component: api
  annotations:
    # Roll the pods when the ExternalSecret rewrites tally-secret.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # `prisma migrate deploy` runs in an init container; Recreate keeps exactly one migrator
  # running across a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      imagePullSecrets:
        - name: tally-ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        # 1) create the tally database + role on the shared cluster
        - name: 01-init-db
          image: ghcr.io/home-operations/postgres-init:18.6
          envFrom: &envFrom
            - secretRef:
                name: tally-secret
          securityContext: &hardened
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # 2) apply the Prisma migrations before anything serves
        - name: 02-migrate
          image: &apiImage ghcr.io/hyperbolic2346/tally-server:0.1.0
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom: *envFrom
          securityContext: *hardened
      containers:
        - name: api
          image: *apiImage
          # The image's own CMD is `prisma migrate deploy && node dist/main.js`; migrations have
          # already run in the init chain, so go straight to the server.
          command: ["node", "dist/main.js"]
          ports:
            - name: http
              containerPort: 3080
          envFrom: *envFrom
          livenessProbe: &probe
            httpGet:
              # Deliberately does not touch the database, so it answers during a database blip.
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe: *probe
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext: *hardened
---
apiVersion: v1
kind: Service
metadata:
  name: tally-api
  namespace: tally
spec:
  selector:
    app.kubernetes.io/name: tally
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tally-api
  namespace: tally
spec:
  parentRefs:
    - name: external
      namespace: kube-system
      # NOTE: this section does not exist on the external Gateway yet. nerdbucket.org is not
      # ${SECRET_DOMAIN}; a listener and a certificate have to be added first — see
      # ../PUBLISH.md step 4 and gateway-tls.yaml.
      sectionName: https-sutler
  hostnames: ["tally-api.nerdbucket.org"]
  rules:
    - backendRefs:
        - name: tally-api
          port: 80
