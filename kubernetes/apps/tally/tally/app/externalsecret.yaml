---
# Everything secret in this namespace, from two 1Password items in the K8s vault:
#
#   "tally"          GHCR_USER, GHCR_TOKEN          (a PAT with read:packages)
#   "cloudnative-pg" POSTGRES_SUPER_USER/PASS       (already exists — Stockpile uses it too)
#
# plus POSTGRES_USER / POSTGRES_PASS in the "tally" item: the app's own role on the shared
# CloudNativePG cluster, invented here (any strong random string) and created on first boot by
# the postgres-init init container in api.yaml. This is exactly the shape
# kubernetes/apps/batcave/stockpile/app/externalsecret.yaml uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tally
  namespace: tally
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tally-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Prisma. Own database + role on the shared cluster, same host Stockpile uses.
        DATABASE_URL: "postgresql://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-rw.databases.svc.cluster.local:5432/tally?schema=public&sslmode=disable"
        # Browser origins allowed to call the API. The server always allows localhost on top
        # of this, so a laptop build can point at production while testing.
        CORS_ORIGINS: "https://tally.nerdbucket.org,https://tally-teach.nerdbucket.org"
        PORT: "3080"
        # postgres-init: creates the tally database and role on the shared cluster.
        INIT_POSTGRES_DBNAME: tally
        INIT_POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: tally
    - extract:
        key: cloudnative-pg
---
# Pull secret for the private GHCR images, same as stockpile-ghcr.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tally-ghcr
  namespace: tally
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tally-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .GHCR_USER .GHCR_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: tally
