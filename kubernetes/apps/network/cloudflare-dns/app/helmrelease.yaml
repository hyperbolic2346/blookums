---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflare-dns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cloudflare-dns
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    provider: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret cloudflare-dns-secret
            key: api-token
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      # Annotations use the GA external-dns.kubernetes.io/ prefix (the default
      # since v0.22.0, which dropped alpha with no fallback). That includes
      # DNSEndpoint providerSpecific names: the cloudflare provider matches
      # them by exact equality against <annotation-prefix>cloudflare-proxied,
      # so an alpha-named entry is silently ignored and the record is proxied.
      #
      # Proxy by default: everything on the external gateway must be
      # orange-clouded, or Cloudflare hands out the raw *.cfargotunnel.com
      # target, which has no public address. Setting cloudflare-proxied on the
      # Gateway instead does not work — only /target propagates from a Gateway
      # to its route-derived records, not this annotation.
      #
      # Game/file-share A records (midgard/prohacker/volition) opt out with a
      # per-record external-dns.kubernetes.io/cloudflare-proxied: "false" and
      # must stay grey — proxying breaks their raw UDP/TCP traffic.
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --gateway-name=external
    triggerLoopOnEvent: true
    policy: sync
    sources: ["crd", "gateway-httproute"]
    txtPrefix: k8s.
    txtOwnerId: default
    domainFilters: ["${SECRET_DOMAIN}", "fierypyropixy.com", "joltwagon.com", "${SECRET_DOMAIN_SUTLER}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
