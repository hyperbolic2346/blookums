---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflare-dns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cloudflare-dns
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    provider: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret cloudflare-dns-secret
            key: api-token
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      # external-dns v0.22.0 switched the default annotation prefix to
      # external-dns.kubernetes.io/ with no fallback, so every
      # external-dns.alpha.kubernetes.io/* annotation in this repo went
      # invisible. The external Gateway's /target then stopped being read and
      # route hostnames were published as A records at the gateway's private
      # LB IP (192.168.14.51) instead of CNAMEs to external.${SECRET_DOMAIN},
      # which killed public access to hass/gate/plex/etc. Pin the old prefix.
      # TODO: migrate all annotations to external-dns.kubernetes.io/ and drop.
      - --annotation-prefix=external-dns.alpha.kubernetes.io/
      # Proxy by default: everything on the external gateway must be
      # orange-clouded, or Cloudflare hands out the raw *.cfargotunnel.com
      # target, which has no public address. Setting cloudflare-proxied on the
      # Gateway instead does not work — only /target propagates from a Gateway
      # to its route-derived records, not this annotation.
      #
      # This flag did previously orange-cloud the Valheim A records and break
      # UDP, but only because v0.22.0's prefix change had made their per-record
      # proxied=false invisible. With --annotation-prefix pinned above those
      # opt-outs are honored again, so midgard/prohacker/volition stay grey.
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --gateway-name=external
    triggerLoopOnEvent: true
    policy: sync
    sources: ["crd", "gateway-httproute"]
    txtPrefix: k8s.
    txtOwnerId: default
    domainFilters: ["${SECRET_DOMAIN}", "fierypyropixy.com", "joltwagon.com", "${SECRET_DOMAIN_SUTLER}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
