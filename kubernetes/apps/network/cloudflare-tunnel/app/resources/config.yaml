---
originRequest:
  originServerName: "external.${SECRET_DOMAIN}"

ingress:
  - hostname: "${SECRET_DOMAIN}"
    service: &svc-external https://cilium-gateway-external.kube-system.svc.cluster.local
  - hostname: "*.${SECRET_DOMAIN}"
    service: *svc-external
  - hostname: "fierypyropixy.com"
    service: &svc-internal https://cilium-gateway-internal.kube-system.svc.cluster.local
    originRequest:
      noTLSVerify: true
  - hostname: "*.fierypyropixy.com"
    service: *svc-internal
    originRequest:
      noTLSVerify: true
  - hostname: "joltwagon.com"
    service: *svc-internal
    originRequest:
      noTLSVerify: true
  - hostname: "sutler.${SECRET_DOMAIN_SUTLER}"
    service: *svc-external
    originRequest:
      # SNI must match the https-sutler listener's cert, not the default
      # originServerName (external.${SECRET_DOMAIN}) set at the top.
      originServerName: "sutler.${SECRET_DOMAIN_SUTLER}"
  - service: http_status:404
