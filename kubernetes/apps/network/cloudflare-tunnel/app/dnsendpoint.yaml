---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: cloudflare-tunnel
spec:
  endpoints:
    - dnsName: "external.${SECRET_DOMAIN}"
      recordType: CNAME
      targets: ["9eb7347a-a83a-43d4-bf3c-142eff3f177e.cfargotunnel.com"]
    # Catch-all for apps on the external gateway (stockpile, hass, etc).
    # Must be a CNAME to the tunnel — an A record to a public LB IP breaks HTTPS
    # (Cloudflare 523). Exact game-server A records (midgard/prohacker) still win.
    - dnsName: "*.${SECRET_DOMAIN}"
      recordType: CNAME
      targets: ["9eb7347a-a83a-43d4-bf3c-142eff3f177e.cfargotunnel.com"]
    - dnsName: "stockpile.${SECRET_DOMAIN}"
      recordType: CNAME
      targets: ["9eb7347a-a83a-43d4-bf3c-142eff3f177e.cfargotunnel.com"]
    - dnsName: "fierypyropixy.com"
      recordType: CNAME
      targets: ["9eb7347a-a83a-43d4-bf3c-142eff3f177e.cfargotunnel.com"]
    - dnsName: "blog.fierypyropixy.com"
      recordType: CNAME
      targets: ["9eb7347a-a83a-43d4-bf3c-142eff3f177e.cfargotunnel.com"]
    - dnsName: "joltwagon.com"
      recordType: CNAME
      targets: ["9eb7347a-a83a-43d4-bf3c-142eff3f177e.cfargotunnel.com"]
    - dnsName: "sutler.${SECRET_DOMAIN_SUTLER}"
      recordType: CNAME
      targets: ["9eb7347a-a83a-43d4-bf3c-142eff3f177e.cfargotunnel.com"]
    - dnsName: "sutler-staging.${SECRET_DOMAIN_SUTLER}"
      recordType: CNAME
      targets: ["9eb7347a-a83a-43d4-bf3c-142eff3f177e.cfargotunnel.com"]
    - dnsName: "tally.${SECRET_DOMAIN_SUTLER}"
      recordType: CNAME
      targets: ["9eb7347a-a83a-43d4-bf3c-142eff3f177e.cfargotunnel.com"]
    - dnsName: "tally-api.${SECRET_DOMAIN_SUTLER}"
      recordType: CNAME
      targets: ["9eb7347a-a83a-43d4-bf3c-142eff3f177e.cfargotunnel.com"]
    - dnsName: "tally-teach.${SECRET_DOMAIN_SUTLER}"
      recordType: CNAME
      targets: ["9eb7347a-a83a-43d4-bf3c-142eff3f177e.cfargotunnel.com"]
