---
# Maison Flacon on Medusa: the test build of the store, served at
# test.${SECRET_DOMAIN}. The live WooCommerce store is the `vaultmistress`
# namespace and shares nothing with this one.
#
# Database credentials are the shared role from the "cloudnative-pg"
# 1Password item; the database itself (maison_flacon) is this app's own.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: maison-flacon
  namespace: maison-flacon
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: maison-flacon-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # sslmode=disable is required: Medusa forces TLS to any non-localhost
        # database otherwise, and the migration times out.
        DATABASE_URL: "postgresql://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-rw.databases.svc.cluster.local:5432/maison_flacon?sslmode=disable"
  dataFrom:
    - extract:
        key: cloudnative-pg
---
# Postgres init (creates the maison_flacon DB on the shared cluster). Mounted
# only into the 01-init-db init container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: maison-flacon-db-init
  namespace: maison-flacon
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: maison-flacon-db-init
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_DBNAME: maison_flacon
        INIT_POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
---
# Pull secret for the private GHCR images. Same read:packages PAT as
# stockpile (1Password item "stockpile", GHCR_USER / GHCR_TOKEN).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: maison-flacon-ghcr
  namespace: maison-flacon
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: maison-flacon-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .GHCR_USER .GHCR_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: stockpile
---
# Secrets nobody needs to choose: generated in-cluster, once. refreshInterval
# 0 keeps them stable; regenerating JWT_SECRET/COOKIE_SECRET would sign
# everyone out, and ADMIN_PASSWORD is only read when the admin user is first
# created.
#
#   kubectl -n maison-flacon get secret maison-flacon-generated \
#     -o jsonpath='{.data.ADMIN_PASSWORD}' | base64 -d
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: maison-flacon-password
  namespace: maison-flacon
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: maison-flacon-generated
  namespace: maison-flacon
spec:
  refreshInterval: "0"
  target:
    name: maison-flacon-generated
    creationPolicy: Owner
  dataFrom:
    - sourceRef: &generator
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: maison-flacon-password
      rewrite:
        - regexp:
            source: password
            target: JWT_SECRET
    - sourceRef: *generator
      rewrite:
        - regexp:
            source: password
            target: COOKIE_SECRET
    - sourceRef: *generator
      rewrite:
        - regexp:
            source: password
            target: ADMIN_PASSWORD
