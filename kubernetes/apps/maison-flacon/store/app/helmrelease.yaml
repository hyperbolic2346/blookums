# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: maison-flacon
  namespace: maison-flacon
spec:
  interval: 30m
  # Cold image pulls, the init chain (init-db, migrate, admin user) and the
  # storefront's build-at-start all land in one install.
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: maison-flacon
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: maison-flacon-ghcr-pull
    controllers:
      # Medusa API + admin dashboard (/app). Recreate (the chart default)
      # because the uploads volume is ReadWriteOnce.
      backend:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            # Image runs as node (1000); the uploads volume must be writable.
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          # 1) create the maison_flacon database on the shared CNPG cluster
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            # Database init credentials are mounted here and nowhere else.
            envFrom:
              - secretRef:
                  name: maison-flacon-db-init
          # 2) schema migrations, then the one-time data seeds (store setup
          #    and the product catalog)
          02-migrate:
            image: &backendImage
              repository: ghcr.io/hyperbolic2346/maison-flacon-backend
              tag: main-66b9d17-b15 # {"$imagepolicy": "flux-system:maison-flacon-backend:tag"}
            command: ["medusa", "db:migrate"]
            env: &backendEnv
              REDIS_URL: "redis://maison-flacon-redis.maison-flacon.svc.cluster.local:6379"
              # Public origin: admin API calls and uploaded image URLs.
              MEDUSA_BACKEND_URL: "https://test.${SECRET_DOMAIN}"
              STORE_CORS: "https://test.${SECRET_DOMAIN}"
              ADMIN_CORS: "https://test.${SECRET_DOMAIN}"
              AUTH_CORS: "https://test.${SECRET_DOMAIN}"
              MEDUSA_WORKER_MODE: "shared"
              ADMIN_EMAIL: "mike@nerdbucket.org"
              # Starting value for the owner's alerts; she changes it in the
              # admin under Settings > Alerts.
              OWNER_EMAIL: "mike@nerdbucket.org"
              # Links in emails (password reset) point here.
              STOREFRONT_URL: "https://test.${SECRET_DOMAIN}"
            envFrom: &backendEnvFrom
              - secretRef:
                  name: maison-flacon-secret
              - secretRef:
                  name: maison-flacon-generated
              # Stripe, PayPal and SMTP settings. Optional: each feature is
              # off until its settings exist (see externalsecret.yaml).
              - secretRef:
                  name: maison-flacon-integrations
                  optional: true
              # EasyPost key for buying postage. Optional in the same way; it
              # is separate so labels can be tried before payments are set up.
              - secretRef:
                  name: maison-flacon-easypost
                  optional: true
          # 3) first admin user; a no-op failure once it exists
          03-admin-user:
            image: *backendImage
            command:
              - sh
              - -c
              - medusa user -e "$ADMIN_EMAIL" -p "$ADMIN_PASSWORD" || echo "admin user already exists"
            env: *backendEnv
            envFrom: *backendEnvFrom
          # 4) offer the payment providers that have credentials
          04-payment-providers:
            image: *backendImage
            command:
              - medusa
              - exec
              - ./src/scripts/sync-payment-providers.js
            env: *backendEnv
            envFrom: *backendEnvFrom
        containers:
          main:
            image: *backendImage
            env: *backendEnv
            envFrom: *backendEnvFrom
            probes:
              liveness: &backendProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 9000
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *backendProbe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 9000
                  periodSeconds: 5
                  failureThreshold: 36
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1536Mi
      # Next.js storefront. Builds when the container starts (it needs the
      # running backend and its publishable key), so startup is slow by design.
      storefront:
        containers:
          main:
            image:
              repository: ghcr.io/hyperbolic2346/maison-flacon-storefront
              tag: main-66b9d17-b15 # {"$imagepolicy": "flux-system:maison-flacon-storefront:tag"}
            env:
              # Server-side rendering talks to the backend in-cluster...
              MEDUSA_BACKEND_URL_INTERNAL: "http://maison-flacon-backend.maison-flacon.svc.cluster.local:9000"
              # ...the browser uses the public origin.
              NEXT_PUBLIC_MEDUSA_BACKEND_URL: "https://test.${SECRET_DOMAIN}"
              NEXT_PUBLIC_BASE_URL: "https://test.${SECRET_DOMAIN}"
              NEXT_PUBLIC_DEFAULT_REGION: "us"
            envFrom:
              # Browser-side keys for Stripe and PayPal. Optional, as above.
              - secretRef:
                  name: maison-flacon-storefront
                  optional: true
            probes:
              liveness: &storefrontProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  periodSeconds: 20
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *storefrontProbe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  periodSeconds: 10
                  # Waiting for the backend plus `next build`: up to 10 minutes.
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 384Mi
              # `next build` is the peak, not serving.
              limits:
                memory: 3Gi
      # Dedicated ephemeral Redis: event bus, workflow engine, cache, locks
      # and admin sessions.
      redis:
        containers:
          main:
            image:
              repository: public.ecr.aws/docker/library/redis
              tag: 8-alpine
            command: ["redis-server", "--save", "", "--appendonly", "no"]
            probes:
              liveness: &redisProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6379
                  initialDelaySeconds: 5
                  periodSeconds: 20
              readiness: *redisProbe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    service:
      backend:
        controller: backend
        ports:
          http:
            port: 9000
      storefront:
        controller: storefront
        ports:
          http:
            port: 8000
      redis:
        controller: redis
        ports:
          redis:
            port: 6379
    persistence:
      # Product images uploaded through the admin (file-local provider).
      # The claim comes from the volsync component (see ks.yaml), which
      # backs it up to R2 nightly and restores it if the volume is ever lost.
      uploads:
        existingClaim: maison-flacon-uploads
        advancedMounts:
          backend:
            # The catalog seed uploads product images during migration.
            02-migrate:
              - path: /app/static
            main:
              - path: /app/static
    route:
      app:
        hostnames: ["test.${SECRET_DOMAIN}"]
        # Internal only while the store is being evaluated: reachable on the
        # home network, not from the internet. Payment webhooks and Apple Pay
        # need `external`, which comes with the move to the real domain.
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          # Medusa: admin dashboard, the three API surfaces, webhooks and
          # uploaded files. /bootstrap is deliberately not routed.
          - matches:
              - path: {type: PathPrefix, value: /app}
              - path: {type: PathPrefix, value: /admin}
              - path: {type: PathPrefix, value: /store}
              - path: {type: PathPrefix, value: /auth}
              - path: {type: PathPrefix, value: /hooks}
              - path: {type: PathPrefix, value: /static}
            backendRefs:
              - identifier: backend
                port: 9000
          # everything else -> the storefront
          - matches:
              - path: {type: PathPrefix, value: /}
            backendRefs:
              - identifier: storefront
                port: 8000
