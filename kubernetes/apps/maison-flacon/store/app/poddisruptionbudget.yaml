---
# Node drains and upgrades take down at most one backend web server at a
# time, so the shop keeps answering.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: maison-flacon-backend
  namespace: maison-flacon
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: maison-flacon
      app.kubernetes.io/controller: backend
