---
# Visit statistics served from the shop's own domain. Ad blockers block the
# Umami host and its usual file name, so the tracker is fetched as
# /_mf/p.js and reports to /_mf/api/send, both forwarded to Umami. Only these
# two exact paths are forwarded: the Umami dashboard is not reachable here.
# The ReferenceGrant allowing this is in the observability namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maison-flacon-stats
  namespace: maison-flacon
spec:
  parentRefs:
    - name: external
      namespace: kube-system
      sectionName: https-maison-flacon-bare
  hostnames:
    - maison-flacon.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /_mf/p.js
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /script.js
      backendRefs:
        - name: umami
          namespace: observability
          port: 3000
    - matches:
        - path:
            type: Exact
            value: /_mf/api/send
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /api/send
      backendRefs:
        - name: umami
          namespace: observability
          port: 3000
