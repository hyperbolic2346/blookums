---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: maison-flacon
  namespace: maison-flacon
spec:
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: databases
    - name: external-secrets-stores
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
  components:
    - ../../../../components/volsync
  path: ./kubernetes/apps/maison-flacon/store/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: cluster-settings
        kind: ConfigMap
    substitute:
      APP: maison-flacon
      # Uploaded images: product photos and the packing slip logo. The
      # database is backed up with the rest of the CNPG cluster. CephFS, so
      # every backend copy can mount it at once.
      VOLSYNC_CLAIM: maison-flacon-media
      VOLSYNC_STORAGECLASS: ceph-ssd-3-replica-filesystem
      VOLSYNC_ACCESSMODES: ReadWriteMany
      VOLSYNC_SNAPSHOTCLASS: csi-ceph-filesystem
      VOLSYNC_CAPACITY: 10Gi
      # The backend runs as node (1000), so the restic mover must too.
      APP_UID: "1000"
      APP_GID: "1000"
