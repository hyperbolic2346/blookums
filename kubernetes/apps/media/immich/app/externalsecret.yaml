---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: immich-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # App
        DB_DATABASE_NAME: &dbName immich
        DB_HOSTNAME: &dbHost "pgvector-rw.databases.svc.cluster.local"
        DB_PORT: "5432"
        DB_USERNAME: &dbUser "{{ .POSTGRES_USER }}"
        DB_PASSWORD: &dbPass "{{ .POSTGRES_PASS }}"
        JWT_SECRET: "{{ .immich_jwt_secret }}"
        TYPESENSE_API_KEY: "{{ .immich_typesense_api_key }}"
  dataFrom:
    - extract:
        key: immich
    # Kept in the same order so every key above resolves exactly as before;
    # only the keys templated above reach the Secret.
    - extract:
        key: cloudnative-pg
---
# Postgres Init - mounted only into the server's init-db init container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db-init
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: immich-db-init
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_DBNAME: immich
        INIT_POSTGRES_HOST: "pgvector-rw.databases.svc.cluster.local"
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: immich
    - extract:
        key: cloudnative-pg
