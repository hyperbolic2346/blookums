---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: videos
spec:
  storageClassName: ''
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  nfs:
    path: ${SECRET_FILESERV_VIDEOS_PATH}
    server: ${SECRET_FILESERV_IP}
  mountOptions:
    - nfsvers=4.1
    - nconnect=8
    - hard
    - noatime
    - rsize=131072
    - wsize=131072
---
