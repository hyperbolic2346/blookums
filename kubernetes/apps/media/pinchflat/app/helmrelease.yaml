# https://github.com/kieraneglin/pinchflat
# Replaces youtubedl-material (unmaintained; its Ubuntu 22.04 image ships Python 3.10,
# which current yt-dlp no longer supports). Pinchflat bundles the standalone yt-dlp
# binary and self-updates it. Downloads go to the same NFS share (youtubedl-nfs).
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinchflat
  namespace: media
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: pinchflat
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        # Match media stack defaults so Plex/Jellyfin/Sonarr/SAB can manage files (568:568)
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 1001

    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          fix-config-permissions:
            image:
              repository: busybox
              tag: 1.38.0@sha256:f97baa533a26513c453a362be331a43eb60214302f449c16571b23cea141dce4
            command: ["sh", "-c", "chown -R 568:568 /config"]
            securityContext:
              runAsUser: 0
              runAsGroup: 0
        containers:
          main:
            image:
              repository: ghcr.io/kieraneglin/pinchflat
              tag: latest@sha256:01b4f98aabaf3f5fe394213f7a32578c9e84e42080f52e2f8334021a4473b202
            env:
              TZ: ${TIMEZONE}
              UMASK: "002"
            command: ["/bin/sh", "-c"]
            args:
              - |
                umask 002
                exec /app/bin/docker_start
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: 8945
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            # Indexing runs up to ~9 yt-dlp processes at once (2 per queue), each with a
            # deno JS-challenge solver (100-320Mi apiece) plus ffmpeg remuxes. 2Gi OOMKilled
            # on 2026-10-29 during initial channel backfill; CPU was pinned at the 2-core
            # limit and heavily throttled. No CPU limit; it's bursty background work.
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8945

    route:
      main:
        hostnames: ["ytd.${SECRET_DOMAIN}", "pinchflat.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: 8945

    persistence:
      config:
        enabled: true
        existingClaim: pinchflat-config
        globalMounts:
          - path: /config
      downloads:
        enabled: true
        existingClaim: youtubedl-nfs
        globalMounts:
          - path: /downloads
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
