---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
#
# The bcrypt hash MUST arrive this way rather than being baked into the
# Caddyfile ConfigMap: hashes are shaped like $2a$14$..., and Flux's postBuild
# envsubst would try to expand the $2a. ESO creates this Secret at runtime, so
# envsubst never sees the value.
#
# Expects a 1Password item named `volition` with a field `password_hash`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: volition
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: volition-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CADDY_PASSWORD_HASH: "{{ .password_hash }}"
  dataFrom:
    - extract:
        key: volition
