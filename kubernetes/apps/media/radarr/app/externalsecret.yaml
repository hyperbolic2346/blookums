---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: radarr-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Radarr
        RADARR__API_KEY: "{{ .RADARR_API_KEY }}"
        RADARR__POSTGRES_MAIN_DB: radarr_main
        RADARR__POSTGRES_LOG_DB: radarr_log
        RADARR__POSTGRES_HOST: &dbHost postgres-rw.databases.svc.cluster.local
        RADARR__POSTGRES_USER: &dbUser "{{ .RADARR_POSTGRES_USER }}"
        RADARR__POSTGRES_PASSWORD: &dbPass "{{ .RADARR_POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: radarr
    # Kept in the same order so every key above resolves exactly as before;
    # only the keys templated above reach the Secret.
    - extract:
        key: cloudnative-pg
---
# Postgres Init - mounted only into the init-db init container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-db-init
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: radarr-db-init
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_DBNAME: radarr_main radarr_log
        INIT_POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .RADARR_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .RADARR_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: radarr
    - extract:
        key: cloudnative-pg
