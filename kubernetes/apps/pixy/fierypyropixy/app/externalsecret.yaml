---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fierypyropixy
  namespace: pixy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: fierypyropixy-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # App config
        POSTGRES_HOST: &dbHost postgres-rw.databases.svc.cluster.local
        POSTGRES_DB: fierypyropixy
        POSTGRES_USER: &dbUser "{{ .POSTGRES_USER }}"
        POSTGRES_PASS: &dbPass "{{ .POSTGRES_PASS }}"
        S3_BUCKET: "{{ .S3_BUCKET }}"
        FPP_ADMIN_PASSWORD: "{{ .FPP_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: fierypyropixy
    # Kept in the same order so every key above resolves exactly as before;
    # only the keys templated above reach the Secret.
    - extract:
        key: cloudnative-pg
---
# Postgres Init - mounted only into the init-db init container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fierypyropixy-db-init
  namespace: pixy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: fierypyropixy-db-init
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_DBNAME: fierypyropixy
        INIT_POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: fierypyropixy
    - extract:
        key: cloudnative-pg
