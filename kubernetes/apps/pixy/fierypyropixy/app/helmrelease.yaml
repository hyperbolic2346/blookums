---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fierypyropixy
  namespace: pixy
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: fierypyropixy
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.7@sha256:6d4cfa4b8d343eb6fa0de8dd9ec416a2007f346bb631fc8e246e1f39eee6c4aa
            envFrom:
              - secretRef:
                  name: fierypyropixy-db-init

        containers:
          main:
            image:
              repository: ghcr.io/hyperbolic2346/fierypyropixy
              tag: sha-293ac44
            env:
              UMAMI_WEBSITE_ID: "98c07e44-963d-49e8-b1bf-4da57deafb2a"
              UMAMI_DOMAIN: "${SECRET_DOMAIN}"
            envFrom:
              - secretRef:
                  name: fierypyropixy-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /index.php
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi

        annotations:
          reloader.stakater.com/auto: "true"

    service:
      main:
        controller: main
        ports:
          http:
            port: 80

    persistence:
      data:
        existingClaim: fierypyropixy-data
        globalMounts:
          - path: /var/www/html/images
            subPath: images
          - path: /var/www/html/thumbs
            subPath: thumbs

    route:
      main:
        hostnames: ["fierypyropixy.com", "www.fierypyropixy.com"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https-fierypyropixy-bare
          - name: internal
            namespace: kube-system
            sectionName: https-fierypyropixy
        rules:
          - backendRefs:
              - identifier: main
                port: 80
