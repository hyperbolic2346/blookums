---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: batcave
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./ocirepository.yaml
  - ./rbac-ci.yaml
  - ./rehearsal-grants.yaml
configMapGenerator:
  - name: stockpile-rehearsal-grants
    files:
      - ./rehearsal-grants.sql
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
