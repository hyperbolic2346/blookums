---
# Permanent redirect from the legacy burntsheep hostname to nerdbucket.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stockpile-redirect
  namespace: batcave
spec:
  parentRefs:
    - name: external
      namespace: kube-system
      sectionName: https
  hostnames: ["stockpile.${SECRET_DOMAIN}"]
  rules:
    - filters:
        - type: RequestRedirect
          # No `scheme:` — Cilium turns it into an http→https rule that only
          # matches X-Forwarded-Proto != https, so on this https listener
          # nothing matched and every request got a 404.
          requestRedirect:
            hostname: "stockpile.${SECRET_DOMAIN_SUTLER}"
            statusCode: 301
