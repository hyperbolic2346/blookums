---
# Permanent redirect from the legacy burntsheep hostname to nerdbucket.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stockpile-redirect
  namespace: batcave
spec:
  parentRefs:
    - name: external
      namespace: kube-system
      sectionName: https
  hostnames: ["stockpile.${SECRET_DOMAIN}"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: "stockpile.${SECRET_DOMAIN_SUTLER}"
            statusCode: 301
