---
# The ci dispatcher reads this Deployment for the image production's api
# runs, which Stockpile's migration rehearsal boots beside the new one (the
# rolling-deploy window; ci/dispatcher, podtemplate-rehearsal.yaml). Get on
# this one object, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-dispatcher-read-api
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["stockpile-api"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-dispatcher-read-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-dispatcher-read-api
subjects:
  - kind: ServiceAccount
    name: dispatcher
    namespace: ci
