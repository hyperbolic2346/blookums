---
# Ingress rules for the stockpile pods. Each policy selects one component by
# its app-template labels; other pods in the namespace are not selected.
#
# Sources:
#   host    - kubelet probes (the node the pod runs on)
#   ingress - the Cilium Gateway API proxy (kube-system/external), which is
#             how HTTPRoute traffic reaches the api and web services
#   prometheus - observability/kube-prometheus-stack, scraping the workers'
#             /metrics on 8091 through the PodMonitor in this directory
#
# Ingress only. Egress is unchanged.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile
      app.kubernetes.io/controller: api
  ingress:
    - fromEntities:
        - host
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-web
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile
      app.kubernetes.io/controller: web
  ingress:
    - fromEntities:
        - host
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# The workers serve only their health port (8091): /healthz and /readyz for
# the kubelet (the node), /metrics for Prometheus.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-worker
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile
      app.kubernetes.io/controller: worker
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8091"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-worker-catalog
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile
      app.kubernetes.io/controller: worker-catalog
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8091"
              protocol: TCP
---
# Redis is used by this release's api and workers only.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-redis
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile
      app.kubernetes.io/controller: redis
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: stockpile
            app.kubernetes.io/controller: api
        - matchLabels:
            app.kubernetes.io/instance: stockpile
            app.kubernetes.io/controller: worker
        - matchLabels:
            app.kubernetes.io/instance: stockpile
            app.kubernetes.io/controller: worker-catalog
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
