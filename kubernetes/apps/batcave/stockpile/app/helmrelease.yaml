apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stockpile
  namespace: batcave
spec:
  interval: 30m
  # Cold image pulls + the init chain (init-db, migrate, seed) can exceed the
  # 5m Helm default, which rolled back a good deploy once — give it room.
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: stockpile
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: stockpile-ghcr-pull
    controllers:
      api:
        annotations:
          reloader.stakater.com/auto: "true"
        # app-template defaults to Recreate. Surge the new pod first; the old
        # one keeps serving until the new one passes readiness
        # (/api/health/ready: database answering, schema current). Relies on
        # migrations being compatible with the previous release (stockpile
        # CLAUDE.md, "Migrations and deploys").
        strategy: RollingUpdate
        rollingUpdate:
          surge: 1
          unavailable: 0
        pod:
          # The api drains for 5s on SIGTERM and exits within 20s.
          terminationGracePeriodSeconds: 30
        initContainers:
          # 1) create the stockpile database + role on the shared CNPG cluster
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            # Database init credentials are mounted here and nowhere else.
            envFrom:
              - secretRef:
                  name: stockpile-db-init
          # 2) apply Prisma migrations
          02-migrate:
            image: &apiImage
              repository: ghcr.io/hyperbolic2346/stockpile-api
              tag: main-e8146c9-b473 # {"$imagepolicy": "flux-system:stockpile-api:tag"}
            command: ["npx", "prisma", "migrate", "deploy"]
            envFrom: &envFrom
              - secretRef:
                  name: stockpile-secret
          # 3) seed vendors/tenants/catalog (idempotent upserts)
          03-seed:
            image: *apiImage
            command: ["node", "dist/seed/main.js"]
            env:
              SUPER_ADMIN_EMAILS: "mike@batcaveballistics.com"
            envFrom: *envFrom
        containers:
          main:
            image: *apiImage
            command: ["node", "dist/main.js"]
            env:
              API_PORT: "8000"
              REDIS_URL: "redis://stockpile-redis.batcave.svc.cluster.local:6379"
              AUTH_CALLBACK_URL: "https://stockpile.${SECRET_DOMAIN}/api/auth/google/callback"
              AUTH_SECURE_COOKIES: "true"
              AUTH_POST_LOGIN_REDIRECT: "/"
              DEFAULT_TENANT: "demo"
              SUPER_ADMIN_EMAILS: "mike@batcaveballistics.com"
            envFrom: *envFrom
            probes:
              liveness: &apiProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 8000
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/ready
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 2
              startup:
                enabled: false
            resources:
              requests:
                cpu: 25m
                memory: 192Mi
              limits:
                memory: 512Mi
      worker:
        annotations:
          reloader.stakater.com/auto: "true"
        # One worker at a time by design (boot-time cleanup of in-progress
        # sync runs assumes a single worker).
        strategy: Recreate
        pod:
          # Running jobs get up to 25s to finish on SIGTERM.
          terminationGracePeriodSeconds: 30
        containers:
          main:
            image: *apiImage
            command: ["node", "dist/worker/main.js"]
            env:
              REDIS_URL: "redis://stockpile-redis.batcave.svc.cluster.local:6379"
            envFrom: *envFrom
            probes:
              # /healthz: 200 while the worker's Redis + database self-check
              # heartbeat is fresh (and while it waits for the schema at boot).
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8091
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 4
              # /readyz: 503 until the database schema matches this image's
              # migrations and the worker has started.
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8091
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 384Mi
      web:
        # Stateless: surge the new pod first, like the api.
        strategy: RollingUpdate
        rollingUpdate:
          surge: 1
          unavailable: 0
        containers:
          main:
            image:
              repository: ghcr.io/hyperbolic2346/stockpile-web
              tag: main-e8146c9-b473 # {"$imagepolicy": "flux-system:stockpile-web:tag"}
            env:
              PUBLIC_API_URL: "https://stockpile.${SECRET_DOMAIN}"
              PORT: "3000"
              # Umami analytics (observability namespace) — the web app's
              # tracking snippet is inert without both of these.
              PUBLIC_UMAMI_SRC: "https://umami.${SECRET_DOMAIN}/script.js"
              PUBLIC_UMAMI_WEBSITE_ID: "a3949217-22a2-446f-9bbd-5dc48bb24c54"
            probes:
              liveness: &webProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *webProbe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 192Mi
      # Dedicated ephemeral Redis for BullMQ (plain Redis is natively
      # BullMQ-compatible; avoids the shared Dragonfly's emulated-cluster mode).
      redis:
        containers:
          main:
            image:
              repository: public.ecr.aws/docker/library/redis
              tag: 8-alpine
            command: ["redis-server", "--save", "", "--appendonly", "no"]
            probes:
              liveness: &redisProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6379
                  initialDelaySeconds: 5
                  periodSeconds: 20
              readiness: *redisProbe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      api:
        controller: api
        ports:
          http:
            port: 8000
      web:
        controller: web
        ports:
          http:
            port: 3000
      redis:
        controller: redis
        ports:
          redis:
            port: 6379
    route:
      app:
        hostnames: ["stockpile.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          # /api -> NestJS backend (more specific prefix wins per Gateway API)
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs:
              - identifier: api
                port: 8000
          # everything else -> the SvelteKit app
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: web
                port: 3000
