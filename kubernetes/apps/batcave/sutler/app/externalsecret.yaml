---
# App config + database. Pulls app secrets from the 1Password item "sutler"
# and the shared superuser creds from "cloudnative-pg".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sutler
  namespace: batcave
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sutler-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Prisma / app database (own DB + role on the shared CNPG cluster)
        DATABASE_URL: "postgresql://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-rw.databases.svc.cluster.local:5432/sutler?sslmode=disable"
        # Auth (Google OAuth + allow-list; JWT signing)
        AUTH_JWT_SECRET: "{{ .AUTH_SESSION_SECRET }}" # 1P item reuses stockpile's field name
        GOOGLE_CLIENT_ID: "{{ .GOOGLE_CLIENT_ID }}"
        GOOGLE_CLIENT_SECRET: "{{ .GOOGLE_CLIENT_SECRET }}"
        AUTH_ALLOWED_EMAILS: "{{ .AUTH_ALLOWED_EMAILS }}"
        # Postgres init (creates the sutler DB + role on the shared cluster)
        INIT_POSTGRES_DBNAME: sutler
        INIT_POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: sutler
    - extract:
        key: cloudnative-pg
---
# Pull secret for the private GHCR images. GitHub PAT with read:packages stored
# in the "sutler" 1Password item (GHCR_USER / GHCR_TOKEN).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sutler-ghcr
  namespace: batcave
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sutler-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .GHCR_USER .GHCR_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: sutler
