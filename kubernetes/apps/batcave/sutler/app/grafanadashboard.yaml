---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: sutler
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  json: |
    {
      "title": "Sutler",
      "uid": "sutler-business",
      "tags": ["sutler", "batcave"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": { "from": "now-30d", "to": "now" },
      "panels": [
        {
          "type": "stat", "title": "Sales (7d)", "id": 1,
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "sum(sutler_sales{window=\"7d\"}) or vector(0)", "instant": true, "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0 } }
        },
        {
          "type": "stat", "title": "Revenue (7d)", "id": 2,
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "sum(sutler_revenue_cents{window=\"7d\"}) / 100 or vector(0)", "instant": true, "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 2 } }
        },
        {
          "type": "stat", "title": "Profit (7d)", "id": 3,
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "sum(sutler_profit_cents{window=\"7d\"}) / 100 or vector(0)", "instant": true, "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 2, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 0 } ] } } }
        },
        {
          "type": "stat", "title": "Profit / sale (7d)", "id": 4,
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "(sum(sutler_profit_cents{window=\"7d\"}) / clamp_min(sum(sutler_sales{window=\"7d\"}), 1)) / 100 or vector(0)", "instant": true, "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 2 } }
        },
        {
          "type": "stat", "title": "Needs attention", "id": 5,
          "gridPos": { "x": 16, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "sum(sutler_orders{status=\"NEEDS_ATTENTION\"}) or vector(0)", "instant": true, "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } } }
        },
        {
          "type": "stat", "title": "Sales missing cost", "id": 6,
          "gridPos": { "x": 20, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "sum(sutler_sales_missing_cost) or vector(0)", "instant": true, "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1 } ] } } }
        },
        {
          "type": "timeseries", "title": "Sales per day", "id": 7,
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum by (marketplace) (delta(sutler_sales_total[1d]))", "legendFormat": "{{marketplace}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0, "custom": { "drawStyle": "bars", "fillOpacity": 60 } } }
        },
        {
          "type": "timeseries", "title": "Profit per day", "id": 8,
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum by (marketplace) (delta(sutler_profit_cents_total[1d])) / 100", "legendFormat": "{{marketplace}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 2, "custom": { "drawStyle": "bars", "fillOpacity": 60 } } }
        },
        {
          "type": "bargauge", "title": "Orders by status", "id": 9,
          "gridPos": { "x": 0, "y": 12, "w": 8, "h": 6 },
          "targets": [{ "expr": "sutler_orders", "legendFormat": "{{status}}", "instant": true, "refId": "A" }],
          "options": { "displayMode": "gradient", "orientation": "horizontal" },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0 } }
        },
        {
          "type": "stat", "title": "Order poll age", "id": 10,
          "gridPos": { "x": 8, "y": 12, "w": 8, "h": 6 },
          "targets": [{ "expr": "time() - sutler_last_poll_timestamp_seconds", "legendFormat": "{{marketplace}}", "instant": true, "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1200 }, { "color": "red", "value": 1800 } ] } } }
        },
        {
          "type": "stat", "title": "Distributor sync age", "id": 11,
          "gridPos": { "x": 16, "y": 12, "w": 8, "h": 6 },
          "targets": [{ "expr": "time() - sutler_last_sync_success_timestamp_seconds", "legendFormat": "{{distributor}}", "instant": true, "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 7200 }, { "color": "red", "value": 21600 } ] } } }
        },
        {
          "type": "timeseries", "title": "Revenue per day", "id": 12,
          "gridPos": { "x": 0, "y": 18, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum by (marketplace) (delta(sutler_revenue_cents_total[1d])) / 100", "legendFormat": "{{marketplace}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 2, "custom": { "drawStyle": "bars", "fillOpacity": 60 } } }
        },
        {
          "type": "timeseries", "title": "Auto-list actions (24h window)", "id": 14,
          "gridPos": { "x": 0, "y": 26, "w": 12, "h": 7 },
          "targets": [
            { "expr": "sum by (action) (sutler_reconcile_actions{window=\"24h\", action=~\"published|ended\"})", "legendFormat": "{{action}}", "refId": "A" },
            { "expr": "sum(sutler_reconcile_actions{window=\"24h\", action=\"failed\"})", "legendFormat": "failed", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0 } }
        },
        {
          "type": "bargauge", "title": "Held back (latest pass)", "id": 15,
          "gridPos": { "x": 12, "y": 26, "w": 6, "h": 7 },
          "targets": [{ "expr": "sum by (kind) (sutler_reconcile_held)", "legendFormat": "{{kind}}", "instant": true, "refId": "A" }],
          "options": { "displayMode": "gradient", "orientation": "horizontal" },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0 } }
        },
        {
          "type": "stat", "title": "Last reconcile pass", "id": 16,
          "gridPos": { "x": 18, "y": 26, "w": 6, "h": 7 },
          "targets": [{ "expr": "time() - sutler_reconcile_last_run_timestamp_seconds", "legendFormat": "{{marketplace}}", "instant": true, "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 3600 }, { "color": "red", "value": 7200 } ] } } }
        },
        {
          "type": "timeseries", "title": "Oldest actionable order age", "id": 13,
          "gridPos": { "x": 12, "y": 18, "w": 12, "h": 8 },
          "targets": [
            { "expr": "sutler_oldest_order_age_seconds", "legendFormat": "{{status}}", "refId": "A" },
            { "expr": "sutler_oldest_unshipped_order_age_seconds", "legendFormat": "unshipped", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 0 } }
        }
      ]
    }
