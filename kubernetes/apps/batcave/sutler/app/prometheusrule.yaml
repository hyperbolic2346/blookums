---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sutler
spec:
  groups:
    - name: sutler.orders
      rules:
        - alert: SutlerOrderNeedsAttention
          expr: sutler_orders{status="NEEDS_ATTENTION"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $value }} sutler order(s) in NEEDS_ATTENTION — a human must
              act (check /orders for the reason on each row).
        - alert: SutlerOrderStuckNew
          expr: sutler_oldest_order_age_seconds{status="NEW"} > 3600
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              A sutler order has sat in NEW for over an hour — the worker or
              the submit path is stalled.
        - alert: SutlerOrderUnshipped
          # 24h, not 48h: 48 spends the entire marketplace handling window
          # before the first word.
          expr: sutler_oldest_unshipped_order_age_seconds > 86400
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              A submitted sutler order has gone 48h with no tracking — the
              distributor may not have shipped; the buyer's clock is running.
    # Every other group here asks "is the machine running?". This one asks
    # "is the data sane?" — the class of failure where the machine runs
    # perfectly and the numbers it runs on are wrong. All of these use
    # metrics that already exist; they compare against recent history rather
    # than absolute thresholds, because the absolute values are per-catalog.
    # In DRY_RUN a sale REQUIRES a human to place the distributor order, so
    # silence is indistinguishable from success. These are the only alerts
    # that fire because something went RIGHT and now needs you.
    - name: sutler.homework
      rules:
        - alert: SutlerManualOrderPending
          expr: sutler_oldest_manual_placement_age_seconds > 7200
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              A sale has waited {{ $value | humanizeDuration }} for you to
              place it at the distributor by hand (DRY_RUN). The exact payload
              is on the row: https://sutler.burntsheep.com/orders
        - alert: SutlerManualOrderOverdue
          expr: sutler_oldest_manual_placement_age_seconds > 86400
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: >-
              OVERDUE 24h+: a DRY_RUN sale still is not placed at the
              distributor. The buyer is waiting and the marketplace shipping
              clock is running. Place it or cancel and refund.
        # Identity-carrying versions: the count-only alerts cannot say WHICH
        # sale, which is the first question at 11pm.
        - alert: SutlerOrderNeedsAttentionNamed
          expr: sutler_open_order_age_seconds{status="NEEDS_ATTENTION"} > 900
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Order {{ $labels.external_order_id }} ({{ $labels.marketplace }})
              needs you — blocked {{ $value | humanizeDuration }}. Reason is on
              the row: https://sutler.burntsheep.com/orders
        - alert: SutlerOrderUnshippedNamed
          expr: sutler_open_order_age_seconds{status=~"SUBMITTED|CONFIRMED"} > 86400
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              Order {{ $labels.external_order_id }}
              ({{ $labels.distributor }}, {{ $labels.mode }}) has no tracking
              after {{ $value | humanizeDuration }}.
    # The failures that leave no failure RECORD — nothing ran, or the thing
    # that would have recorded it was itself what broke.
    - name: sutler.silent
      rules:
        - alert: SutlerListingLiveNotListable
          expr: sum(sutler_listings_live_not_listable) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: >-
              {{ $value }} listing(s) are LIVE and purchasable but no longer
              listable (out of stock, de-whitelisted, or channel-blocked) and
              nothing has ended them. A buyer can order these right now and we
              cannot ship. End them, or check whether auto-list is running.
        - alert: SutlerReconcileNotRunning
          expr: time() - sutler_reconcile_last_pass_timestamp_seconds > 7200
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              No reconcile pass has completed for {{ $labels.marketplace }} in
              2h+ (kill switch, disabled config, failed connection test, or a
              dead listings queue). Nothing will end a listing that sells out.
        - alert: SutlerMarketScanFailing
          expr: sutler_market_scan_last_status == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              The last market scan FAILED — competitor pricing is frozen and
              the repricer never ran. Otherwise silent for 24h.
        # If this fires, assume every other sutler alert is NOT evaluating.
        - alert: SutlerMetricsDown
          expr: absent(sutler_funnel)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: >-
              Sutler metrics are not being scraped — every other sutler alert
              is silently not evaluating. Check the api pod and its database.
        - alert: SutlerChannelNeverPolled
          expr: absent(sutler_last_poll_timestamp_seconds{marketplace="gunbroker"})
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: >-
              No GunBroker order poll has EVER succeeded on this config. The
              staleness alert keys off a timestamp that does not exist yet, so
              it cannot fire — this is its go-live stand-in.
    - name: sutler.sanity
      rules:
        - alert: SutlerFeedTruncated
          expr: >-
            sutler_sync_items{kind="FULL",count="seen"}
              < 0.80 * max_over_time(sutler_sync_items{kind="FULL",count="seen"}[7d])
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              {{ $labels.distributor }} FULL feed delivered only {{ $value }}
              rows — under 80% of its 7d peak. Everything missing goes STALE
              and the reconciler will END those listings. Treat the catalog as
              untrustworthy until the next good sync.
        - alert: SutlerEligibleShelfCollapse
          expr: >-
            sutler_funnel{stage="eligible"}
              < 0.60 * avg_over_time(sutler_funnel{stage="eligible"}[6h] offset 6h)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: >-
              The eligible shelf collapsed to {{ $value }} items (under 60% of
              the last 6h average) — a bad feed, not a real inventory move.
              Listings are being ended on the strength of it.
        - alert: SutlerEligibilityFlipStorm
          expr: sutler_eligibility_flips{direction="lost", window="24h"} > 500
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: >-
              {{ $value }} products lost eligibility in 24h. Catches feed
              damage whether or not anything was listed — unlike the
              mass-ending rule, which needs a storefront big enough to notice.
        - alert: SutlerQuantityFeedChurnStorm
          expr: >-
            sutler_sync_items{kind="QUANTITY",count="changed"}
              > 0.25 * sutler_sync_items{kind="QUANTITY",count="seen"}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              {{ $labels.distributor }} quantity feed changed {{ $value }} rows
              in one pass — a quarter of the catalog does not move at once.
              Suspect a column shift zeroing quantities.
        - alert: SutlerMarginCliff
          expr: >-
            sutler_eligible_margin_cents{agg="p50"}
              < 0.50 * avg_over_time(sutler_eligible_margin_cents{agg="p50"}[24h] offset 24h)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: >-
              Median eligible net margin halved to {{ $value | humanize }}c —
              suspect a distributor COST feed error. Sourcing picks the
              CHEAPEST offer, so corrupt costs win every routing decision.
              Turn auto-list off before the next reconcile pass.
        - alert: SutlerReconcileMassPublishing
          expr: sum(sutler_reconcile_actions{action="published", window="24h"}) > 50
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: >-
              Auto-list published {{ $value }} listings in 24h. The mass-ending
              rule had no twin; a pricing error that makes everything look
              profitable shows up here first.
    - name: sutler.listings
      rules:
        # The one that means money is at risk: we asked the marketplace to
        # pull a listing, it refused, and the item is STILL purchasable while
        # we believe it is coming down. That is the oversell path.
        - alert: SutlerListingStuckActive
          expr: sum(sutler_listings_stuck_active) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: >-
              {{ $value }} live listing(s) failed to end and are still
              purchasable — end them on the marketplace directly, then clear
              the row. Oversell risk while this is up.
        # Covers MANUAL publishes too: the reconcile-failure alert only sees
        # the auto-list path, so with auto-list off nothing else notices a
        # rejected publish.
        - alert: SutlerListingErrors
          expr: sum(sutler_listings{status="ERROR"}) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $value }} production listing(s) in ERROR — the marketplace
              rejected the publish; inventory is not earning until it's fixed.
    - name: sutler.autolist
      rules:
        - alert: SutlerReconcileMassEnding
          # Absolute OR proportional: a 15-listing storefront can be wiped
          # entirely without ever reaching 20.
          expr: >-
            sum(sutler_reconcile_actions{action="ended", window="24h"}) > 20
            or
            sum(sutler_reconcile_actions{action="ended", window="24h"})
              > 0.25 * clamp_min(sum(sutler_listings{status="ACTIVE"}), 1)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: >-
              Auto-list ended {{ $value }} listings in 24h — a feed glitch may
              be taking the catalog down; check the reconcile runs.
        - alert: SutlerReconcileFailures
          expr: sum(sutler_reconcile_actions{action="failed", window="24h"}) > 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: >-
              Auto-list actions are failing (marketplace/API rejections) and
              staying failed — check the worker log and ERROR listings.
    - name: sutler.pipeline
      rules:
        - alert: SutlerSyncWedged
          expr: sum(sutler_sync_wedged) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              A distributor sync has been stuck RUNNING for 30+ minutes —
              likely a crashed worker mid-sync; check the worker pod.
        - alert: SutlerMarketScanStale
          expr: time() - sutler_market_scan_last_success_timestamp_seconds > 86400
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              No successful market scan in 24+ hours — competitor-price data
              is stale and follow-market pricing is flying blind.
        - alert: SutlerOrderPollStale
          expr: time() - sutler_last_poll_timestamp_seconds > 1800
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              No successful {{ $labels.marketplace }} order poll in 30+
              minutes — sutler is blind to new sales.
        - alert: SutlerSyncStale
          expr: time() - sutler_last_sync_success_timestamp_seconds > 21600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              No successful {{ $labels.distributor }} sync in 6+ hours —
              listed quantities are drifting from reality (oversell risk).
