---
# Staging app config + database. Pulls from a SEPARATE 1Password item
# "sutler-staging" — deliberately not the prod "sutler" item.
#
# Why separate: prod's GunBroker credentials are on the SANDBOX today, so the
# immediate risk isn't real listings — it's collision. Two deployments pointed
# at one seller account both poll /OrdersSold on a 10-minute timer and both
# ingest the same orders, and staging's MarketplaceListing rows would reference
# items prod created. Give staging its own sandbox seller account.
#
# The second reason arrives later: when prod flips to production GunBroker keys
# and live RSR ordering, staging is tracking main and running unreviewed code.
# It must not be able to publish a real listing or place a real drop-ship order.
#
# Required fields in the 1Password item "sutler-staging":
#   POSTGRES_USER, POSTGRES_PASS      - staging's own DB role
#   AUTH_SESSION_SECRET               - distinct from prod
#   GOOGLE_CLIENT_ID/SECRET           - may reuse prod's OAuth app if the
#                                       staging callback URL is registered on it
#   AUTH_ALLOWED_EMAILS               - who may sign in
#   GHCR_USER, GHCR_TOKEN             - read:packages PAT (same as prod is fine)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sutler-staging
  namespace: batcave
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sutler-staging-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Its own database on the shared CNPG cluster — never prod's.
        DATABASE_URL: "postgresql://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-rw.databases.svc.cluster.local:5432/sutler_staging?sslmode=disable"
        AUTH_JWT_SECRET: "{{ .AUTH_SESSION_SECRET }}"
        GOOGLE_CLIENT_ID: "{{ .GOOGLE_CLIENT_ID }}"
        GOOGLE_CLIENT_SECRET: "{{ .GOOGLE_CLIENT_SECRET }}"
        AUTH_ALLOWED_EMAILS: "{{ .AUTH_ALLOWED_EMAILS }}"
        INIT_POSTGRES_DBNAME: sutler_staging
        INIT_POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: sutler-staging
    - extract:
        key: cloudnative-pg
---
# Pull secret for the private GHCR images.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sutler-staging-ghcr
  namespace: batcave
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sutler-staging-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .GHCR_USER .GHCR_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: sutler-staging
