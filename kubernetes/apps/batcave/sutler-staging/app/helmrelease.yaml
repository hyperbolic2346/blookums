# Sutler STAGING — tracks `main`, so it gets whatever just merged.
#
# Prod (../sutler) tracks semver tags instead, which is the point of the pair:
# schema migrations run automatically as an initContainer, so without this split
# every merge to main would apply migrations straight to the production
# database. Staging takes that hit first, against a throwaway DB.
#
# Isolation from prod:
#   - its own database (sutler_staging) on the shared CNPG cluster
#   - its own 1Password item, with GunBroker SANDBOX credentials only
#   - its own Redis, so BullMQ jobs can't cross over
#   - sutler-staging.${SECRET_DOMAIN_SUTLER}, covered by the same wildcard TLS
#     listener as prod (https-sutler matches *.${SECRET_DOMAIN_SUTLER})
#
# Rebuilding its data (needs a catalog first — let the worker sync, or run
# rsr:sync):
#   kubectl -n batcave exec deploy/sutler-staging-api -- \
#     node dist/seed/multivendor.js
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sutler-staging
  namespace: batcave
spec:
  interval: 30m
  # Cold image pulls + the init chain (init-db, migrate, seed) can exceed the
  # 5m Helm default (stockpile got rolled back by that once) — give it room.
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: sutler-staging
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: sutler-staging-ghcr-pull
    controllers:
      api:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # 1) create the sutler database + role on the shared CNPG cluster
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
            envFrom: &envFrom
              - secretRef:
                  name: sutler-staging-secret
          # 2) apply Prisma migrations before the seed runs. The api image's
          # default CMD also runs `migrate deploy` on boot; doing it here first
          # keeps the init ordering correct (init-db -> migrate -> seed -> api)
          # and the boot-time re-run is an idempotent no-op.
          02-migrate:
            image: &apiImage
              repository: ghcr.io/hyperbolic2346/sutler-api
              tag: main-a50c1d8-b98 # {"$imagepolicy": "flux-system:sutler-api-staging:tag"}
            command: ["npx", "prisma", "migrate", "deploy"]
            envFrom: *envFrom
          # 3) seed baseline data (idempotent upserts)
          03-seed:
            image: *apiImage
            command: ["node", "dist/seed/main.js"]
            envFrom: *envFrom
        containers:
          main:
            image: *apiImage
            # No command override: the image CMD runs
            # `npx prisma migrate deploy && node dist/main.js`.
            env:
              API_PORT: "8000"
              REDIS_URL: "redis://sutler-staging-redis.batcave.svc.cluster.local:6379"
              # Do NOT schedule distributor syncs here. stockpile and sutler prod already
              # pull RSR on a schedule; a third set of periodic FTPS logins just so a
              # staging box has fresh data is a bad trade. It takes a catalog copy instead.
              SYNC_SCHEDULE_ENABLED: "false"
              AUTH_CALLBACK_URL: "https://sutler-staging.${SECRET_DOMAIN_SUTLER}/api/auth/google/callback"
            envFrom: *envFrom
            probes:
              liveness: &apiProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 8000
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *apiProbe
              # The CMD runs migrations before the server binds; the startup
              # probe keeps liveness from killing the pod during a long deploy.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 8000
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 25m
                memory: 192Mi
              limits:
                memory: 512Mi
      worker:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Wait for the api's 02-migrate init container to bring the schema
          # current. The worker shares the api image (prisma CLI + schema) and
          # the same DATABASE_URL; `migrate status` exits 0 only when every
          # migration in prisma/migrations is applied, and non-zero while any
          # are pending or the database/role doesn't exist yet. Only the api
          # ever runs `migrate deploy` -- this just polls. Without it, a release
          # carrying a migration rolls the worker before the api has applied
          # it, and the worker crashloops on "column ... does not exist" until
          # the api finishes (seen with 0.3.0 / TenantMarketplaceConfig).
          # 150 x 4s = 10m, matching the HelmRelease timeout. No shell
          # variables on purpose: Flux's strict envsubst rejects any dollar-name it
          # doesn't know.
          01-wait-for-migrations:
            image: *apiImage
            command: ["sh", "-c"]
            args:
              - |
                for _ in $(seq 1 150); do
                  if npx prisma migrate status >/dev/null 2>&1; then
                    echo "migrations current"
                    exit 0
                  fi
                  echo "waiting for migrations..."
                  sleep 4
                done
                echo "migrations still pending after 10m, giving up"
                npx prisma migrate status
                exit 1
            envFrom: *envFrom
        containers:
          main:
            image: *apiImage
            command: ["node", "dist/worker/main.js"]
            env:
              REDIS_URL: "redis://sutler-staging-redis.batcave.svc.cluster.local:6379"
              # Do NOT schedule distributor syncs here. stockpile and sutler prod already
              # pull RSR on a schedule; a third set of periodic FTPS logins just so a
              # staging box has fresh data is a bad trade. It takes a catalog copy instead.
              SYNC_SCHEDULE_ENABLED: "false"
            envFrom: *envFrom
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 384Mi
      web:
        containers:
          main:
            image:
              repository: ghcr.io/hyperbolic2346/sutler-web
              tag: main-a50c1d8-b98 # {"$imagepolicy": "flux-system:sutler-web-staging:tag"}
            env:
              PUBLIC_API_URL: "https://sutler-staging.${SECRET_DOMAIN_SUTLER}"
              # No Umami here on purpose — the web app only emits analytics when
              # BOTH vars are set, so staging traffic stays out of prod's stats.
              PORT: "3000"
            probes:
              liveness: &webProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *webProbe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 192Mi
      # Dedicated ephemeral Redis for BullMQ (plain Redis is natively
      # BullMQ-compatible; avoids the shared Dragonfly's emulated-cluster mode).
      redis:
        containers:
          main:
            image:
              repository: public.ecr.aws/docker/library/redis
              tag: 8-alpine
            command: ["redis-server", "--save", "", "--appendonly", "no"]
            probes:
              liveness: &redisProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6379
                  initialDelaySeconds: 5
                  periodSeconds: 20
              readiness: *redisProbe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      api:
        controller: api
        ports:
          http:
            port: 8000
      web:
        controller: web
        ports:
          http:
            port: 3000
      redis:
        controller: redis
        ports:
          redis:
            port: 6379
    route:
      app:
        hostnames: ["sutler-staging.${SECRET_DOMAIN_SUTLER}"]
        parentRefs:
          - name: external
            namespace: kube-system
            # Sutler's apex has its own TLS listener on the external gateway
            # (the plain `https` listener only matches *.${SECRET_DOMAIN}).
            sectionName: https-sutler
        rules:
          # /api -> NestJS backend (more specific prefix wins per Gateway API)
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs:
              - identifier: api
                port: 8000
          # everything else -> the SvelteKit app
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: web
                port: 3000
