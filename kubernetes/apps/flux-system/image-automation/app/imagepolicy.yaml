---
# CI tags main-branch builds as main-<shortsha>-b<run#> (stockpile
# .github/workflows/build.yaml); the run number gives a sortable ordering
# that a bare short SHA can't.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: stockpile-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: stockpile-api
  filterTags:
    pattern: '^main-[0-9a-f]+-b(?P<build>\d+)$'
    extract: '$build'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: stockpile-web
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: stockpile-web
  filterTags:
    pattern: '^main-[0-9a-f]+-b(?P<build>\d+)$'
    extract: '$build'
  policy:
    numerical:
      order: asc
---
# Sutler PROD tracks released semver tags only. Sutler applies Prisma
# migrations from an initContainer, so tracking `main` here would run every
# merged schema change against the production database unattended. Cutting a
# `v*` tag in the sutler repo is now the deploy gate. Staging (below) takes
# `main` instead, so the migration path is exercised before a release.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sutler-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: sutler-api
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=0.0.0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sutler-web
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: sutler-web
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=0.0.0'
---
# Sutler STAGING follows main — the behaviour prod used to have.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sutler-api-staging
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: sutler-api
  filterTags:
    pattern: '^main-[0-9a-f]+-b(?P<build>\d+)$'
    extract: '$build'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sutler-web-staging
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: sutler-web
  filterTags:
    pattern: '^main-[0-9a-f]+-b(?P<build>\d+)$'
    extract: '$build'
  policy:
    numerical:
      order: asc
