---
# Stockpile PROD tracks released semver tags only (stockpile#334, the nightly
# release train), as sutler prod does. A scheduled workflow in the stockpile
# repo tags main's head vX.Y.Z overnight once the cluster build and the
# migration rehearsal passed on that commit; the CI dispatcher builds the tag
# and pushes X.Y.Z. Main builds (main-<sha>-b<N>) are still built and pushed
# (staging, the rehearsal), but prod no longer takes them.
# Rollback to every-merge deploys: put both policies back to filterTags
# '^main-[0-9a-f]+-b(?P<build>\d+)$' / extract '$build' / numerical asc.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: stockpile-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: stockpile-api
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=0.0.0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: stockpile-web
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: stockpile-web
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=0.0.0'
---
# Sutler PROD tracks released semver tags only. Sutler applies Prisma
# migrations from an initContainer, so tracking `main` here would run every
# merged schema change against the production database unattended. Cutting a
# `v*` tag in the sutler repo is now the deploy gate. Staging (below) takes
# `main` instead, so the migration path is exercised before a release.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sutler-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: sutler-api
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=0.0.0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sutler-web
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: sutler-web
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=0.0.0'
---
# Sutler STAGING follows main — the behaviour prod used to have.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sutler-api-staging
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: sutler-api
  filterTags:
    pattern: '^main-[0-9a-f]+-b(?P<build>\d+)$'
    extract: '$build'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sutler-web-staging
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: sutler-web
  filterTags:
    pattern: '^main-[0-9a-f]+-b(?P<build>\d+)$'
    extract: '$build'
  policy:
    numerical:
      order: asc
