---
# Password of the read-only role stockpile_grafana (../cluster/cluster.yaml,
# managed.roles), generated here once (refreshInterval 0): nothing to put in
# 1Password. CNPG sets it on the role; Grafana's datasource reads the same
# Secret (grafanadatasource.yaml).
#   kubectl -n databases get secret stockpile-grafana-db -o jsonpath='{.data.password}' | base64 -d
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: stockpile-grafana-password
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stockpile-grafana-db
spec:
  refreshInterval: "0"
  target:
    name: stockpile-grafana-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: stockpile_grafana
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: stockpile-grafana-password
