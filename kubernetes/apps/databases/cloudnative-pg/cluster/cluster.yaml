---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: databases
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-bookworm@sha256:4b6c13e807656537a424b29fd4265da331d9869578007dd34faf810f0ed8cb9a
  enableSuperuserAccess: true
  primaryUpdateStrategy: unsupervised
  bootstrap:
    recovery:
      source: postgres
  externalClusters:
    - name: postgres
      barmanObjectStore:
        destinationPath: s3://blookums-databases-oct-25/postgres
        endpointURL: ${SECRET_DATABASE_S3}
        serverName: postgres
        s3Credentials:
          accessKeyId:
            key: AWS_BACKUP_ACCESS_KEY_ID
            name: cloudnative-pg-secret
          secretAccessKey:
            key: AWS_BACKUP_SECRET_ACCESS_KEY
            name: cloudnative-pg-secret
        data:
          compression: bzip2
        wal:
          compression: bzip2
          maxParallel: 8
  env:
    - name: TZ
      value: ${TIMEZONE}
  storage:
    size: 50Gi
    storageClass: ${CLUSTER_STORAGE_BLOCK_SSD_3_REPLICA}
  superuserSecret:
    name: cloudnative-pg-secret
  postgresql:
    parameters:
      max_connections: "600"
      shared_buffers: 512MB
      # Replicas tell the primary which rows their open reads still need, so
      # a long read there isn't cancelled "due to conflict with recovery".
      # The rehearsal's pg_dump of stockpile (ProductImage alone ~1 GB) lost
      # all three tries to that on 2026-11-10/11. Cost: the primary's vacuum
      # waits for those reads (minutes).
      hot_standby_feedback: "on"
    # stockpile_rehearsal (managed.roles below) may connect to the stockpile
    # database only, and only from a pod address (the cluster's pod CIDR;
    # the ci namespace's network policy further limits it to the replicas).
    # CNPG places these before its closing `host all all all scram-sha-256`,
    # so the second line refuses that role everything else.
    pg_hba:
      - host stockpile stockpile_rehearsal 10.42.0.0/16 scram-sha-256
      - host all stockpile_rehearsal all reject
      # Grafana's read-only view of the stockpile database (Stockpile — Store
      # board; role stockpile_grafana below). Same shape.
      - host stockpile stockpile_grafana 10.42.0.0/16 scram-sha-256
      - host all stockpile_grafana all reject
      # Telemetry (apps/telemetry): its owner role and Grafana's read-only role may reach
      # the telemetry database only, from pods. Same shape as above.
      - host telemetry telemetry 10.42.0.0/16 scram-sha-256
      - host all telemetry all reject
      - host telemetry telemetry_reader 10.42.0.0/16 scram-sha-256
      - host all telemetry_reader all reject
      # Stockpile shadow staging (apps/stockpile-staging, roles below). The
      # app role reaches its own database only: never production's
      # stockpile, never the refresh's scratch copy stockpile_staging_next
      # (which holds unscrubbed data until the scrub has passed). The refresh
      # role reaches the staging databases and the maintenance database
      # (CREATE/RENAME/DROP DATABASE), never stockpile.
      - host stockpile_staging stockpile_staging 10.42.0.0/16 scram-sha-256
      - host all stockpile_staging all reject
      - host stockpile_staging,stockpile_staging_next,stockpile_staging_old,postgres stockpile_staging_refresh 10.42.0.0/16 scram-sha-256
      - host all stockpile_staging_refresh all reject
      # Staging's online store's public api (role below): its one database,
      # from pods; refused everywhere else (PUBLIC holds CONNECT on most of
      # this cluster's databases).
      - host stockpile_staging stockpile_staging_public 10.42.0.0/16 scram-sha-256
      - host all stockpile_staging_public all reject
  managed:
    roles:
      # Login for Stockpile's migration rehearsal (ci namespace, PodTemplate
      # rehearsal-stockpile): pg_dump of the stockpile database from a
      # replica. No role memberships: it may read only what the stockpile
      # database's owner grants it there (SELECT on its tables and
      # sequences; CronJob batcave/stockpile-rehearsal-grants). It cannot
      # read the shared catalogs' secrets (pg_authid) or any other database.
      - name: stockpile_rehearsal
        ensure: present
        comment: Stockpile migration rehearsal, read-only (ci namespace)
        login: true
        inherit: false
        connectionLimit: 2
        passwordSecret:
          name: stockpile-rehearsal-db
      # Login for Grafana's stockpile-postgres datasource (../grafana-stockpile).
      # No role memberships: it may read only the columns the stockpile
      # database's owner grants it (amounts, counts, states, timestamps —
      # never a buyer's or customer's details; CronJob
      # batcave/stockpile-rehearsal-grants, grafana-grants.sql). Its password
      # is generated in-cluster, nothing in 1Password.
      - name: stockpile_grafana
        ensure: present
        comment: Grafana, read-only, some columns of the stockpile database
        login: true
        inherit: false
        connectionLimit: 4
        passwordSecret:
          name: stockpile-grafana-db
      # Stockpile shadow staging (apps/stockpile-staging, stockpile#331).
      # Passwords: 1Password item "stockpile-staging", through the
      # ExternalSecret in ../stockpile-staging. Its database is the Database
      # object there, owned by stockpile_staging.
      #   stockpile_staging          the staging app (and its migrations).
      #   stockpile_staging_refresh  the nightly refresh: builds the scratch
      #       copy stockpile_staging_next as its own (the app role may not
      #       connect to it), then hands it to stockpile_staging and swaps
      #       it in. CREATEDB and membership in stockpile_staging are what
      #       that needs (REASSIGN OWNED, ALTER DATABASE RENAME, DROP).
      #       No membership in any production role.
      #   stockpile_staging_public   the online store's public api on staging:
      #       only the columns stockpile's applier grants it there, on every
      #       api start. Its own role, not production's storefront_public: a role
      #       is cluster-wide, so sharing that name would put a login that also
      #       opens production in staging's item. No memberships, and readiness
      #       refuses the pod if it ever gets one.
      - name: stockpile_staging
        ensure: present
        comment: Stockpile shadow staging app (stockpile-staging namespace)
        login: true
        connectionLimit: 30
        passwordSecret:
          name: stockpile-staging-db
      - name: stockpile_staging_refresh
        ensure: present
        comment: Stockpile shadow staging nightly refresh (stockpile-staging namespace)
        login: true
        createdb: true
        inherit: true
        connectionLimit: 3
        inRoles:
          - stockpile_staging
        passwordSecret:
          name: stockpile-staging-refresh-db
      - name: stockpile_staging_public
        ensure: present
        comment: Stockpile shadow staging online store, restricted (stockpile-staging namespace)
        login: true
        inherit: false
        connectionLimit: 8
        passwordSecret:
          name: stockpile-staging-public-db
  backup:
    retentionPolicy: 14d
    barmanObjectStore:
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 8
      destinationPath: s3://blookums-databases/postgres
      endpointURL: ${SECRET_DATABASE_S3}
      serverName: postgres
      s3Credentials:
        accessKeyId:
          key: AWS_ACCESS_KEY_ID
          name: cloudnative-pg-secret
        secretAccessKey:
          key: AWS_SECRET_ACCESS_KEY
          name: cloudnative-pg-secret
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
