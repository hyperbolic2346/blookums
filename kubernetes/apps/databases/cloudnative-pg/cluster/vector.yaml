---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pgvector
  namespace: databases
spec:
  instances: 3
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.14-1.1.1
  enableSuperuserAccess: true
  primaryUpdateStrategy: unsupervised
  bootstrap:
    recovery:
      source: pgvector-recovery
  externalClusters:
    - name: pgvector-recovery
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: pgvector
          serverName: pgvector-v2
  env:
  - name: TZ
    value: ${TIMEZONE}
  storage:
    size: 50Gi
    storageClass: ${CLUSTER_STORAGE_BLOCK_SSD_3_REPLICA}
  superuserSecret:
    name: cloudnative-pg-secret
  postgresql:
    shared_preload_libraries:
     - "vchord.so"
    parameters:
      max_connections: "600"
      shared_buffers: 512MB
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pgvector
        serverName: pgvector-v2
  monitoring:
    enablePodMonitor: true
    # Ref: https://github.com/cloudnative-pg/cloudnative-pg/issues/2501
    podMonitorMetricRelabelings:
      - {
        sourceLabels: ["cluster"],
        targetLabel: cnpg_cluster,
        action: replace,
      }
      - { regex: cluster, action: labeldrop }
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
