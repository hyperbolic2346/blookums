---
# Password of the read-only role stockpile_rehearsal (../cluster/cluster.yaml,
# managed.roles), for Stockpile's migration rehearsal: 1Password item "ci",
# field rehearsal_db_password. The same field feeds ci/ci-rehearsal-db,
# which only the rehearsal's copy step mounts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stockpile-rehearsal-db
  namespace: databases
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: stockpile-rehearsal-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: stockpile_rehearsal
        password: "{{ .rehearsal_db_password }}"
  data:
    - secretKey: rehearsal_db_password
      remoteRef:
        key: ci
        property: rehearsal_db_password
