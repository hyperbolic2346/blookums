---
# Passwords of Stockpile shadow staging's two roles (../cluster/cluster.yaml,
# managed.roles), from staging's OWN 1Password item "stockpile-staging"
# (never production's). The same fields feed the stockpile-staging
# namespace's secrets (apps/stockpile-staging).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stockpile-staging-db
  namespace: databases
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: stockpile-staging-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: stockpile_staging
        password: "{{ .POSTGRES_PASS }}"
  data:
    - secretKey: POSTGRES_PASS
      remoteRef:
        key: stockpile-staging
        property: POSTGRES_PASS
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stockpile-staging-refresh-db
  namespace: databases
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: stockpile-staging-refresh-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: stockpile_staging_refresh
        password: "{{ .REFRESH_POSTGRES_PASS }}"
  data:
    - secretKey: REFRESH_POSTGRES_PASS
      remoteRef:
        key: stockpile-staging
        property: REFRESH_POSTGRES_PASS
