---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: databases
spec:
  path: ./kubernetes/apps/databases/cloudnative-pg/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-cluster
  namespace: databases
spec:
  dependsOn:
    - name: cloudnative-pg
    - name: external-secrets-stores
      namespace: kube-system
  path: ./kubernetes/apps/databases/cloudnative-pg/cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: cluster-settings
        kind: ConfigMap
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# The rehearsal role's password, apart from the cluster: not waited on, so
# a missing 1Password field never holds up cloudnative-pg-cluster (and the
# apps that depend on it).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-rehearsal
  namespace: databases
spec:
  dependsOn:
    - name: external-secrets-stores
      namespace: kube-system
  path: ./kubernetes/apps/databases/cloudnative-pg/rehearsal
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# Stockpile shadow staging's role passwords and database (stockpile-staging/),
# apart from the cluster for the same reason as the rehearsal's: a missing
# 1Password item never holds up cloudnative-pg-cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-stockpile-staging
  namespace: databases
spec:
  dependsOn:
    - name: cloudnative-pg-cluster
    - name: external-secrets-stores
      namespace: kube-system
  path: ./kubernetes/apps/databases/cloudnative-pg/stockpile-staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# Grafana's login to the stockpile database (grafana-stockpile/): its
# generated password and the datasource. Apart from the cluster, not waited on.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-grafana-stockpile
  namespace: databases
spec:
  dependsOn:
    - name: external-secrets-stores
      namespace: kube-system
  path: ./kubernetes/apps/databases/cloudnative-pg/grafana-stockpile
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
