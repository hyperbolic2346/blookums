---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: percona-xtradb
  namespace: databases
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: percona-xtradb-secret
    # Merge, not Owner. The PXC operator generates its own system-user
    # passwords (`replication`, `proxyadmin`) and writes them into this same
    # secret. Under Owner, ESO treats any key it does not declare as drift and
    # strips both back out, the operator regenerates them, and the two fight
    # roughly every 20s. Each round appends an ALTER USER line to
    # percona-xtradb-mysql-init, which reached the 1MiB Secret ceiling on
    # 2026-09-24 and took reconcileUsers down with it — no user in spec.users
    # could be created at all. Merge leaves undeclared keys alone.
    #
    # Trade-off: Merge will not CREATE the secret, only update it. If
    # percona-xtradb-secret is ever deleted, restore it before ESO can sync
    # (deletionPolicy: Retain keeps that from happening on its own).
    creationPolicy: Merge
  data:
    - secretKey: root
      remoteRef:
        key: percona-xtradb
        property: ROOT_PASSWORD
    - secretKey: operator
      remoteRef:
        key: percona-xtradb
        property: OPERATOR_PASSWORD
    - secretKey: monitor
      remoteRef:
        key: percona-xtradb
        property: MONITOR_PASSWORD
    - secretKey: xtrabackup
      remoteRef:
        key: percona-xtradb
        property: XTRABACKUP_PASSWORD
    - secretKey: WORDPRESS_DB_PASSWORD
      remoteRef:
        key: pixyblog
        property: WORDPRESS_DB_PASSWORD
    - secretKey: OLIVERBLOG_DB_PASSWORD
      remoteRef:
        key: oliverblog
        property: WORDPRESS_DB_PASSWORD
    - secretKey: VAULTMISTRESS_DB_PASSWORD
      remoteRef:
        key: vaultmistress
        property: WORDPRESS_DB_PASSWORD
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: database-backup
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: database-backup
        property: AWS_SECRET_ACCESS_KEY
