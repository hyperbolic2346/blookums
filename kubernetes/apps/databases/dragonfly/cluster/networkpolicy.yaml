---
# The operator-managed "dragonfly" NetworkPolicy only admits same-namespace
# pods on 6379 (bare podSelector, no namespaceSelector). Policies are
# additive, so this opens 6379 to clients in any namespace while the
# operator's policy keeps the admin port (9999) restricted to peers and
# the operator.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-allow-redis-clients
spec:
  podSelector:
    matchLabels:
      app: dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 6379
          protocol: TCP
