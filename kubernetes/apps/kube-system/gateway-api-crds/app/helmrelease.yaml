---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gateway-api-crds
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gateway-api-crds
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # The chart ships the CRDs as templates, so a Helm uninstall (including an
  # install-failure remediation) would delete them and cascade-delete every
  # Gateway/HTTPRoute. Keep them no matter what happens to this release.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CustomResourceDefinition
            patch: |
              - op: add
                path: /metadata/annotations/helm.sh~1resource-policy
                value: keep
