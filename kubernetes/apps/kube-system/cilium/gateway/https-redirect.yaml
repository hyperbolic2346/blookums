---
# Plain-HTTP requests to the external/internal gateways used to get an empty
# 404 with no Content-Type, which iOS Safari offers as a "document" download.
# Redirect every http:// request on those gateways to https://.
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
spec:
  parentRefs:
    - name: external
      namespace: kube-system
      sectionName: http
    - name: internal
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
