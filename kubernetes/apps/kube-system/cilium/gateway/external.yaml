---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  annotations:
    external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
    external-dns.kubernetes.io/target: "external.${SECRET_DOMAIN}"
    # NB: only /target propagates from a Gateway to its route-derived records.
    # Adding external-dns.alpha.kubernetes.io/cloudflare-proxied here has no
    # effect (verified against external-dns v0.22.0) — proxying is handled by
    # --cloudflare-proxied on the cloudflare-dns HelmRelease instead.
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: "192.168.14.51"
  infrastructure:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: "external.${SECRET_DOMAIN}"
      external-dns.kubernetes.io/hostname: "external.${SECRET_DOMAIN}"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.${SECRET_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${SECRET_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: ${SECRET_DOMAIN/./-}-production-tls
    - name: https-sutler
      protocol: HTTPS
      port: 443
      hostname: "*.${SECRET_DOMAIN_SUTLER}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: ${SECRET_DOMAIN_SUTLER/./-}-production-tls
