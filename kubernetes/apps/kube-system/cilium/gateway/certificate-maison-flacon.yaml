---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maison-flacon-com-production
spec:
  secretName: maison-flacon-com-production-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: maison-flacon.com
  dnsNames: ["maison-flacon.com", "*.maison-flacon.com"]
