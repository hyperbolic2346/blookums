---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: batcaveballistics-com-production
spec:
  secretName: batcaveballistics-com-production-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: batcaveballistics.com
  dnsNames: ["batcaveballistics.com", "*.batcaveballistics.com"]
