---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.20.2
  # home-operations/charts-mirror deprecates a chart once upstream publishes its
  # own OCI chart, and prunes it 6 months later. Its newest cilium was 1.18.6, so
  # renovate had nothing to offer and we silently froze. Upstream chart from here on.
  url: oci://quay.io/cilium/charts/cilium
