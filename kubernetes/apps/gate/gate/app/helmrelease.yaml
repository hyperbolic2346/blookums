---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gate
  namespace: gate
spec:
  interval: 10m
  chart:
    spec:
      chart: gate-charts
      version: '0.95'
      sourceRef:
        kind: HelmRepository
        name: gate-charts
  # gate-charts renders its Ingress unconditionally -- there is no values
  # toggle for it -- and the cluster has had no ingress controller since the
  # move to Cilium Gateway API, so it was never programmed. ./httproute.yaml
  # serves gate.${SECRET_DOMAIN} instead, so drop the dead object here.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: networking.k8s.io
              version: v1
              kind: Ingress
              name: gate-gate
            patch: |
              apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: gate-gate
              $patch: delete
  values:
    celery:
      image: ${SECRET_DOCKER_USER}/celery_motion:v2
      persistence:
        enabled: true
        existingClaim: security-camera
    gate:
      image: ${SECRET_DOCKER_USER}/gate:latest
      persistence:
        existingClaim: gate
        securityClaim: security-camera
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
      clusterissuer: letsencrypt-production
      hostname: gate.${SECRET_DOMAIN}
      ingressClassName: external
      ingressClass: external
    motion:
      image: ${SECRET_DOCKER_USER}/motion:v2
      motionNodePort: 9081
      persistence:
        enabled: true
        existingClaim: security-camera
    mysql:
      mysqlAllowEmptyPassword: false
      mysqlRootPassword: ${SECRET_GATE_MYSQL_PW}
      persistence:
        enabled: true
        existingClaim: mysql
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
      configurationFiles:
        sanity.cnf: |-
          [mysqld]
          sql_mode = NO_ENGINE_SUBSTITUTION
        time.cnf: |-
          [mysqld]
          default_time_zone=America/New_York
