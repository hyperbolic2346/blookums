---
# The runner pods use a privileged Docker-in-Docker sidecar, so this
# namespace is labelled for the privileged Pod Security level. Only the
# runner scale sets deploy here.
apiVersion: v1
kind: Namespace
metadata:
  name: actions-runners
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
