---
# Runner pods sit below every other workload (default priority 0) and never
# preempt anything. Under node pressure they are evicted first.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: actions-runner
value: -100
preemptionPolicy: Never
globalDefault: false
description: GitHub Actions runner pods; lower than all other workloads.
