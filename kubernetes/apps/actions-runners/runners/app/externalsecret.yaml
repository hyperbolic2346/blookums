---
# GitHub App credentials for the runner scale sets, from the 1Password item
# "actions-runner-controller". The item must exist before this secret can
# sync. Fields:
#   github_app_id                - App ID (or client ID)
#   github_app_installation_id   - installation ID on the account
#   github_app_private_key_b64   - the App private key (PEM), base64-encoded
#                                  onto one line; decoded here
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actions-runner-controller
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: actions-runner-controller-github-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        github_app_id: "{{ .github_app_id }}"
        github_app_installation_id: "{{ .github_app_installation_id }}"
        github_app_private_key: "{{ .github_app_private_key_b64 | b64dec }}"
  dataFrom:
    - extract:
        key: actions-runner-controller
