---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw
  namespace: openclaw
spec:
  dependsOn:
    - name: external-secrets-stores
      namespace: kube-system
    - name: rook-ceph-cluster
      namespace: storage
  path: ./kubernetes/apps/openclaw/openclaw/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: cluster-settings
        kind: ConfigMap
