---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: telemetry
resources:
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./networkpolicy.yaml
  - ./poddisruptionbudget.yaml
  - ./grafana.yaml
configMapGenerator:
  # Run by the superuser in the 02-reader-role init container.
  - name: telemetry-reader-sql
    files:
      - ./reader-role.sql
  # One Grafana board per game, generated by dashboards/build.ts in the app repo.
  - name: telemetry-dashboards
    files:
      - ./dashboards/screwed.json
      - ./dashboards/teeter.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # SQL and dashboard JSON are taken as written: no ${...} substitution.
    kustomize.toolkit.fluxcd.io/substitute: disabled
