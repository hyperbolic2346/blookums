---
# Two database logins of its own, so this public endpoint never holds the shared app role
# (which owns every other app's database):
#
#   telemetry          owns the telemetry database; the server and the nightly job use it
#   telemetry_reader   read-only, telemetry database only; Grafana uses it (grafana.yaml)
#
# Both passwords are generated here, once (refreshInterval 0), so there is nothing to put in
# 1Password. The init containers set them on the roles at every start, so a regenerated
# Secret (say, after the namespace is recreated) simply takes over.
#
#   kubectl -n telemetry get secret telemetry-generated -o jsonpath='{.data.READER_PASSWORD}' | base64 -d
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: telemetry-password
  namespace: telemetry
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telemetry-generated
  namespace: telemetry
spec:
  refreshInterval: "0"
  target:
    name: telemetry-generated
    creationPolicy: Owner
  dataFrom:
    - sourceRef: &generator
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: telemetry-password
      rewrite:
        - regexp:
            source: password
            target: DB_PASSWORD
    - sourceRef: *generator
      rewrite:
        - regexp:
            source: password
            target: READER_PASSWORD
---
# Postgres init: creates the telemetry database and its owner role on the shared cluster, and
# (02-reader-role) the read-only role. The superuser login is from the "cloudnative-pg"
# 1Password item, as for every app; it is mounted into those two init containers only. The
# owner's password (INIT_POSTGRES_PASS) comes from telemetry-generated in the pod spec.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telemetry-db-init
  namespace: telemetry
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: telemetry-db-init
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_DBNAME: telemetry
        INIT_POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        INIT_POSTGRES_USER: telemetry
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
---
# Pull secret for the private GHCR image. Same read:packages PAT as stockpile and
# maison-flacon (1Password item "stockpile", GHCR_USER / GHCR_TOKEN).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telemetry-ghcr
  namespace: telemetry
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: telemetry-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .GHCR_USER .GHCR_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: stockpile
