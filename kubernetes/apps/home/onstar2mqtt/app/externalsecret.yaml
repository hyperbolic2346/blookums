---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onstar2mqtt
  namespace: home
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: onstar2mqtt-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Accept either short names or ONSTAR_* in 1Password; map to container envs.
        ONSTAR_USERNAME: '{{ index . "username" | default (index . "ONSTAR_USERNAME") }}'
        ONSTAR_PASSWORD: '{{ index . "password" | default (index . "ONSTAR_PASSWORD") }}'
        ONSTAR_PIN: '{{ index . "pin" | default (index . "ONSTAR_PIN") }}'
        ONSTAR_TOTP: '{{ index . "totp" | default (index . "ONSTAR_TOTP") }}'
        ONSTAR_VIN: '{{ index . "vin" | default (index . "ONSTAR_VIN") }}'
  dataFrom:
    - extract:
        key: onstar2mqtt
