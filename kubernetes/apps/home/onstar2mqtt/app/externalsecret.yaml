---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onstar2mqtt
  namespace: home
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: onstar2mqtt-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Accept either short names or ONSTAR_* in 1Password; map to container envs.
        ONSTAR_USERNAME: "{{ .username | default .ONSTAR_USERNAME }}"
        ONSTAR_PASSWORD: "{{ .password | default .ONSTAR_PASSWORD }}"
        ONSTAR_PIN: "{{ .pin | default .ONSTAR_PIN }}"
        ONSTAR_TOTP: "{{ .totp | default .ONSTAR_TOTP }}"
        ONSTAR_VIN: "{{ .vin | default .ONSTAR_VIN }}"
  dataFrom:
    - extract:
        key: onstar2mqtt
