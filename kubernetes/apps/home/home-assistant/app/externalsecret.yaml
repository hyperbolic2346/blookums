---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant
  namespace: home
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: home-assistant-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Home Assistant
        HASS_ELEVATION: "{{ .HASS_ELEVATION }}"
        HASS_LATITUDE: "{{ .HASS_LATITUDE }}"
        HASS_LONGITUDE: "{{ .HASS_LONGITUDE }}"
        HASS_POSTGRES_URL: "postgresql://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-rw.databases.svc.cluster.local/home_assistant"
        # HA secrets.yaml - mounted as a file
        HASS_SECRETS_YAML: |
          emoncms_api_key: "{{ .EMONCMS_API_KEY }}"
          fortnite_api_key: "{{ .FORTNITE_API_KEY }}"
          homekit_code: "{{ .HOMEKIT_CODE }}"
  dataFrom:
    - extract:
        key: home-assistant
    # Kept in the same order so every key above resolves exactly as before;
    # only the keys templated above reach the Secret.
    - extract:
        key: cloudnative-pg
---
# Postgres Init - mounted only into the init-db init container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-db-init
  namespace: home
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: home-assistant-db-init
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_DBNAME: home_assistant
        INIT_POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: home-assistant
    - extract:
        key: cloudnative-pg
