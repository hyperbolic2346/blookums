# Frigate event history -> sensors for the Wildlife dashboard.
# Frigate's own event DB has ~a year of history with snapshots; HA's
# recorder only keeps 30 days and its frigate image entities reset on
# restart, so query the API directly. Snapshots are served by the template
# image entities in sensors/wildlife.yaml.
- resource: http://frigate.home.svc.cluster.local:5000/api/events?labels=bear,deer,fox,raccoon,rabbit,squirrel&has_snapshot=1&limit=3000
  scan_interval: 600
  timeout: 30
  sensor:
  - name: Wildlife Latest
    unique_id: wildlife_latest
    icon: mdi:paw
    device_class: timestamp
    value_template: "{{ as_datetime(value_json[0].start_time).isoformat() if value_json else none }}"
    json_attributes_path: "$[0]"
    json_attributes: [id, label, camera]
  # Comma-separated sighting counts per local hour 0-23, for the
  # "when they visit" chart (apexcharts data_generator parses it).
  - name: Wildlife By Hour
    unique_id: wildlife_by_hour
    icon: mdi:clock-outline
    value_template: >-
      {% set hours = value_json | map(attribute='start_time') | map('timestamp_custom', '%H') | map('int') | list %}
      {% set ns = namespace(out=[]) %}
      {% for i in range(24) %}{% set ns.out = ns.out + [hours | select('eq', i) | list | count] %}{% endfor %}
      {{ ns.out | join(',') }}
  # Last 12 months, oldest first.
  - name: Bear By Month
    unique_id: bear_by_month
    icon: mdi:calendar-month
    value_template: >-
      {% set months = value_json | selectattr('label', 'eq', 'bear') | map(attribute='start_time') | map('timestamp_custom', '%Y-%m') | list %}
      {% set ns = namespace(out=[]) %}
      {% for i in range(11, -1, -1) %}{% set m = (now().replace(day=15) - timedelta(days=30 * i)).strftime('%Y-%m') %}{% set ns.out = ns.out + [months | select('eq', m) | list | count] %}{% endfor %}
      {{ ns.out | join(',') }}
  # Last 12 months, oldest first.
  - name: Deer By Month
    unique_id: deer_by_month
    icon: mdi:calendar-month
    value_template: >-
      {% set months = value_json | selectattr('label', 'eq', 'deer') | map(attribute='start_time') | map('timestamp_custom', '%Y-%m') | list %}
      {% set ns = namespace(out=[]) %}
      {% for i in range(11, -1, -1) %}{% set m = (now().replace(day=15) - timedelta(days=30 * i)).strftime('%Y-%m') %}{% set ns.out = ns.out + [months | select('eq', m) | list | count] %}{% endfor %}
      {{ ns.out | join(',') }}
  # Last 12 months, oldest first.
  - name: Other Wildlife By Month
    unique_id: other_wildlife_by_month
    icon: mdi:calendar-month
    value_template: >-
      {% set months = value_json | rejectattr('label', 'in', ['bear', 'deer']) | map(attribute='start_time') | map('timestamp_custom', '%Y-%m') | list %}
      {% set ns = namespace(out=[]) %}
      {% for i in range(11, -1, -1) %}{% set m = (now().replace(day=15) - timedelta(days=30 * i)).strftime('%Y-%m') %}{% set ns.out = ns.out + [months | select('eq', m) | list | count] %}{% endfor %}
      {{ ns.out | join(',') }}
  - name: Bear Last Seen
    unique_id: wildlife_bear_last_seen
    icon: mdi:paw
    device_class: timestamp
    value_template: >-
      {% set e = value_json | selectattr('label', 'eq', 'bear') | first %}
      {{ as_datetime(e.start_time).isoformat() if e else none }}
    json_attributes_path: "$[?(@.label=='bear')]"
    json_attributes: [id, camera]
  - name: Bear Sightings 30d
    unique_id: wildlife_bear_sightings_30d
    icon: mdi:counter
    unit_of_measurement: visits
    value_template: >-
      {{ value_json | selectattr('label', 'eq', 'bear')
         | selectattr('start_time', 'gt', (now() - timedelta(days=30)).timestamp()) | list | count }}
  - name: Bear Sightings 12mo
    unique_id: wildlife_bear_sightings_12mo
    icon: mdi:counter
    unit_of_measurement: visits
    value_template: >-
      {{ value_json | selectattr('label', 'eq', 'bear')
         | selectattr('start_time', 'gt', (now() - timedelta(days=365)).timestamp()) | list | count }}
  - name: Deer Last Seen
    unique_id: wildlife_deer_last_seen
    icon: mdi:paw
    device_class: timestamp
    value_template: >-
      {% set e = value_json | selectattr('label', 'eq', 'deer') | first %}
      {{ as_datetime(e.start_time).isoformat() if e else none }}
    json_attributes_path: "$[?(@.label=='deer')]"
