# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

homeassistant:
  customize_glob:
    sensor.haenergy_*:
      last_reset: "2021-08-05T08:05:00+00:00"
      state_class: measurement

# Text to speech
tts:
  - platform: google_translate

input_select:
  master_bathroom_occupancy:
    name: Master Bathroom Occupancy
    options:
      - Empty
      - Unknown
      - Occupied
      - Pending Exit
    initial: Empty
  bathroom_sound:
    name: Bathroom Sound
    options:
      - sound_princess
      - waterfall
      - white_noise_waterfall
      - heavy_rain
      - rainstorm
      - forest_creek
    initial: sound_princess
    icon: mdi:music-note
  climate_zone:
    name: Selected Climate Zone
    options:
      - Master Bed
      - Library
      - Office
      - Oliver's
      - Master Bath
      - Master Hall
      - Master Closet
      - Guest Bath
      - Entry
      - Outside
    initial: Master Bed

input_button:
  master_bath_fan_timed:
    name: Master Bath Fan 30 min
    icon: mdi:fan-clock

input_number:
  bathroom_sound_volume:
    name: Bathroom Sound Volume
    min: 0.05
    max: 0.5
    step: 0.05
    initial: 0.2
    icon: mdi:volume-medium

utility_meter:
  monthly_house_energy:
    source: sensor.house_energy
    name: Monthly House Energy
    cycle: monthly
  monthly_left_panel_energy:
    source: sensor.left_panel_energy
    name: Monthly Left Panel Energy
    cycle: monthly
  monthly_right_panel_energy:
    source: sensor.right_panel_energy
    name: Monthly Right Panel Energy
    cycle: monthly
  monthly_garage_energy:
    source: sensor.garage_energy
    name: Monthly Garage Energy
    cycle: monthly

group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.0.0.0/8

template: !include_dir_merge_list sensors
rest: !include rest.yaml
mqtt: !include_dir_merge_named mqtt

alarm_control_panel:
  - platform: manual
    name: Home Alarm
    arming_time: 30
    delay_time: 20
    trigger_time: 4
    disarmed:
      trigger_time: 0
    armed_home:
      arming_time: 0
      delay_time: 0

notify:
  - name: mikeandjolei
    platform: group
    services:
    - service: mobile_app_dumpster_fire
    - service: mobile_app_minionmama
    - service: mobile_app_joanna_s_iphone_new

sensor:
 # Garage feed isn't metered; integrate the estimate (sensors/garage.yaml).
 - platform: integration
   source: sensor.garage_power
   name: Garage Energy
   unique_id: garage_energy_kwh
   unit_prefix: k
   round: 2
   method: left
   max_sub_interval:
     minutes: 5
 - platform: emoncms
   api_key: !secret emoncms_api_key
   url: http://10.0.1.210/emoncms
   id: 1
 - platform: fortnite
   name: Oliver's Fortnite Solo Stats
   api_key: !secret fortnite_api_key
   player_id: david croked
   game_platform: "PC"
   game_mode: "SOLO"
 - platform: fortnite
   name: Fortnite Duo Stats
   api_key: !secret fortnite_api_key
   player_id: david croked
   game_platform: "PC"
   game_mode: "DUO"
 - platform: fortnite
   name: Fortnite Squads Stats
   api_key: !secret fortnite_api_key
   player_id: david croked
   game_platform: "PC"
   game_mode: "SQUAD"

anniversaries:
  sensors:
  - name: Knobby & Pixy Wedding
    date: '2005-08-14'
  - name: Knobby's Birthday
    date: '1978-09-20'
  - name: Pixy's Birthday
    date: '1980-05-12'
  - name: Oliver's Birthday
    date: '2014-01-26'

homekit:
  - filter:
      include_domains:
        - alarm_control_panel
        - light
        - cover
        - lock
    entity_config:
      alarm_control_panel.home:
        code: !secret homekit_code
      lock.front_door:
        code: !secret homekit_code
  - name: HASS Bridge 2
    port: 21065
    filter:
      include_domains:
        - light

sonos:
  media_player:
    hosts:
      - 10.0.7.60
      - 10.0.7.61
      - 10.0.7.62
      - 10.0.7.63
      - 10.0.7.64

prometheus:
  namespace: homeassistant
  filter:
    include_domains:
      - binary_sensor
      - sensor
      - lock
      - light
      - switch
      - cover
      - climate
      - person
      - device_tracker

lovelace:
  mode: yaml
  # Custom cards. Files live on the PVC under www/community/<repo>/ (HACS
  # layout, served at /hacsfiles/); YAML mode means HACS can't register them.
  resources:
    - url: /hacsfiles/vehicle-status-card/vehicle-status-card.js
      type: module
    - url: /hacsfiles/power-flow-card-plus/power-flow-card-plus.js
      type: module
    - url: /hacsfiles/apexcharts-card/apexcharts-card.js
      type: module
    - url: /hacsfiles/lovelace-mushroom/mushroom.js
      type: module
    - url: /hacsfiles/mini-graph-card/mini-graph-card-bundle.js
      type: module
    - url: /hacsfiles/custom-sonos-card/custom-sonos-card.js
      type: module
  dashboards:
    dashboard-simple:
      mode: yaml
      title: Simple
      icon: mdi:home
      show_in_sidebar: true
      filename: dashboards/dashboard_simple.yaml
    dashboard-map:
      mode: yaml
      title: Map
      icon: mdi:map
      show_in_sidebar: true
      filename: dashboards/map.yaml
    dashboard-minimalist:
      mode: yaml
      title: Home Climate
      icon: mdi:thermometer
      show_in_sidebar: true
      filename: dashboards/dashboard_minimalist.yaml
    dashboard-ipad:
      mode: yaml
      title: iPad
      icon: mdi:tablet
      show_in_sidebar: true
      filename: dashboards/dashboard_ipad.yaml
    dashboard-energy:
      mode: yaml
      title: Energy
      icon: mdi:lightning-bolt
      show_in_sidebar: true
      filename: dashboards/dashboard_energy.yaml
    dashboard-wildlife:
      mode: yaml
      title: Wildlife
      icon: mdi:paw
      show_in_sidebar: true
      filename: dashboards/dashboard_wildlife.yaml
    dashboard-music:
      mode: yaml
      title: Music
      icon: mdi:speaker-multiple
      show_in_sidebar: true
      filename: dashboards/dashboard_music.yaml
