- title: Master Bedroom
  path: master-bedroom
  cards:
  - type: vertical-stack
    cards:
    - type: horizontal-stack
      cards:
      - type: light
        entity: light.torus
        name: Torus
      - type: light
        entity: light.cans_3
        name: Hall
    - type: horizontal-stack
      cards:
      - show_name: true
        show_icon: true
        type: button
        tap_action:
          action: toggle
        name: Knobby Bed Light
        entity: light.knobby_light
      - type: entities
        entities:
        - entity: fan.master_bedroom
        - entity: light.torus
        - entity: sensor.master_bedroom_temperature
        - entity: switch.master_bedroom_whoosh
        - entity: binary_sensor.master_bedroom_occupancy
  - graph: line
    type: sensor
    entity: sensor.master_closet1_temperature
    detail: 1
    name: Master Closet
  - graph: line
    type: sensor
    entity: sensor.master_hall_temperature
    detail: 1
    name: Master Hall
  - graph: line
    type: sensor
    entity: sensor.master_bedroom_temperature
    detail: 1
    name: Master Bedroom
  - show_name: true
    show_icon: true
    type: button
    entity: script.goodnight_storms
  - type: media-control
    entity: media_player.master_bedroom
  icon: mdi:bed-king
  subview: false
- title: Master Bath
  path: master-bath
  icon: mdi:bathtub
  cards:
  - type: vertical-stack
    cards:
    - type: horizontal-stack
      cards:
      - show_name: true
        show_icon: true
        type: button
        tap_action:
          action: toggle
        entity: switch.master_bath_fan
        name: Fan
        icon: mdi:fan
      - show_name: true
        show_icon: true
        type: button
        tap_action:
          action: call-service
          service: input_button.press
          target:
            entity_id: input_button.master_bath_fan_timed
        entity: input_button.master_bath_fan_timed
        name: Fan 30 min
        icon: mdi:fan-clock
    # Climate gets its own FULL-WIDTH card. It used to be the third element of
    # the horizontal-stack above, which on a phone left it a third of the screen
    # and truncated every label to "T..." / "D...". Glance keeps the values big
    # and the names short enough to survive four columns.
    - type: glance
      title: Climate
      columns: 4
      entities:
      - entity: sensor.master_bath1_temperature
        name: Temp
      - entity: sensor.master_bath1_humidity
        name: Humidity
      - entity: sensor.master_bath_dew_point
        name: Dew pt
      - entity: sensor.master_bath_dew_point_excess
        name: Excess
    - type: entities
      title: Room
      entities:
      - entity: input_select.master_bathroom_occupancy
        name: Occupancy
      # The entity_id never followed an alias rename: this automation is called
      # "Bathroom - Start Sound on Toilet Motion" but its entity_id is still
      # automation.bathroom_toilet_motion_detected. The dashboard was guessing
      # the slugified alias, which is what drew the warning card on this view.
      - entity: automation.bathroom_toilet_motion_detected
        name: Potty Princess
        icon: mdi:music-note-off
      - entity: binary_sensor.master_bath0_motion
        name: Motion 0
      - entity: binary_sensor.master_bath1_motion
        name: Motion 1
    - type: horizontal-stack
      cards:
      - type: light
        name: Cans
        entity: light.master_bath_cans
      - type: light
        entity: light.master_bath_shower
        name: Shower
      - type: light
        entity: light.master_bath_torus
        name: Torus
    - graph: line
      type: sensor
      entity: sensor.master_bath1_temperature
      detail: 1
      name: Master Bath
    - graph: line
      type: sensor
      entity: sensor.master_bath1_humidity
      detail: 1
      name: Master Bath Humidity
    - graph: line
      type: sensor
      entity: sensor.master_closet1_humidity
      detail: 1
      name: Master Closet Humidity
    - graph: line
      type: sensor
      entity: sensor.master_hall_humidity
      detail: 1
      name: Master Hall Humidity
    - type: entity
      entity: automation.turn_on_shower_cans_with_fan
      name: Shower Lights with Fan
      icon: mdi:light-recessed
      state_color: true
    - graph: line
      type: sensor
      entity: sensor.master_bathroom_humidity_derivative
      detail: 1
    # Dew point is the comparable quantity across rooms; RH is not, because
    # upstairs and downstairs run on different thermostats. Watching these
    # together is what decides whether BathFan should switch to dew point and
    # which room is the honest "dry house" reference.
    - type: history-graph
      title: Dew point by room
      hours_to_show: 24
      entities:
        - entity: sensor.master_bath_dew_point
          name: Master Bath
        - entity: sensor.master_hall_dew_point
          name: Master Hall
        - entity: sensor.master_closet_dew_point
          name: Master Closet
        - entity: sensor.guest_bath_dew_point
          name: Guest Bath
        - entity: sensor.entry_dew_point
          name: Entry
    - graph: line
      type: sensor
      entity: sensor.master_bath_dew_point_excess
      detail: 1
      name: Bath dew point above driest room
  - type: media-control
    entity: media_player.master_bathroom
  subview: false
