# Music dashboard - Sonos (Spotify via Sonos Favorites).
#
# Custom card: custom-sonos-card v10.8.5 (punxaphil), hand-installed to
# www/community/custom-sonos-card/ and registered in lovelace.resources.
# Card instances on one page share the selected player, so picking a group in
# the left column drives the player/queue/volumes elsewhere.
#
# Spotify: the HA Spotify integration can't reliably target Sonos, so playlists
# come from Sonos Favorites (add them in the Sonos app).
title: Music
views:
- type: sections
  title: Music
  path: music
  icon: mdi:speaker-multiple
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Rooms
      icon: mdi:speaker-multiple
    - type: custom:sonos-card
      grid_options:
        columns: full
      sections:
      - groups
      - grouping
      predefinedGroups:
      - name: Everywhere
        entities:
        - media_player.living_room
        - media_player.library
        - media_player.master_bedroom
        - media_player.master_bathroom
        - media_player.office
      - name: Downstairs
        entities:
        - media_player.living_room
        - media_player.library
      - name: Master Suite
        entities:
        - media_player.master_bedroom
        - media_player.master_bathroom
  - type: grid
    cards:
    - type: heading
      heading: Now Playing
      icon: mdi:music
    - type: custom:sonos-card
      grid_options:
        columns: full
      sections:
      - player
      - volumes
      - queue
      player:
        artworkAsBackground: true
  - type: grid
    cards:
    - type: heading
      heading: Favorites
      icon: mdi:spotify
    - type: custom:sonos-card
      grid_options:
        columns: full
      sections:
      - media browser
      mediaBrowser:
        onlyFavorites: true
        itemsPerRow: 3
