# Master Bath exhaust fan switch.
# Device: Shelly 1PM Mini Gen3 on STOCK firmware, native MQTT (replaced the old
# 2019 Sonoff Basic/Tasmota). Shelly's native topic scheme: command/status live
# under the configured MQTT prefix "masterbathfan"; availability is /online
# (retained true|false). Non-optimistic: state is driven by the device's status
# publish, which the A2 "confirm-before-arm" hold-on script relies on.
# unique_id kept as master-bath-sonoff-fan ON PURPOSE so the entity_id stays
# switch.master_bath_fan (AppDaemon BathFan + every automation depend on it).
switch:
  - name: "Master Bath Fan"
    unique_id: master-bath-sonoff-fan
    command_topic: "masterbathfan/command/switch:0"
    payload_on: "on"
    payload_off: "off"
    state_topic: "masterbathfan/status/switch:0"
    value_template: "{{ 'on' if value_json.output else 'off' }}"
    state_on: "on"
    state_off: "off"
    availability_topic: "masterbathfan/online"
    payload_available: "true"
    payload_not_available: "false"
    qos: 1
    retain: false

# ---------------------------------------------------------------------------
# DHT22 TEMPERATURE SENSORS LIVE HERE FOR AN ANNOYING REASON.
#
# They belong in their own configs/mqtt/dht22-temperature.yaml, but ADDING a
# config file requires a new subPath mount in helmrelease.yaml, and this
# HelmRelease has been SUSPENDED BY HAND since 2026-06-16 (`flux suspend`, not
# in git). While suspended, ConfigMap *content* still deploys — the generator
# updates the ConfigMap and Stakater Reloader rolls the pod — but nothing that
# needs a Deployment spec change lands. A new file would sit in the ConfigMap
# permanently unmounted, which is exactly what happened on the first attempt.
#
# Resuming the HelmRelease is not a free action: git has HA queued from the
# running 2026.6.3 up to 2026.8.1, plus a postgres-init bump. That upgrade
# deserves its own maintenance window, not a side effect of a sensor fix.
#
# TODO when the HelmRelease is resumed: move this block into its own
# configs/mqtt/dht22-temperature.yaml and add it to BOTH the configMapGenerator
# file list and the helmrelease subPath mounts.
#
# --- why these exist at all ---
# These nodes self-announce over MQTT discovery declaring the temperature unit
# as bare "F". HA requires °F/°C/K for device_class: temperature and rejects the
# entity outright:
#   2026-08-03 12:36:34 ERROR [mqtt.entity] Error 'The unit of measurement `F`
#   is not valid together with device class `temperature`' ... master_bath1t
# All six died at that instant when HA tightened the validation. Humidity was
# unaffected because "%" is valid — same device, same JSON payload:
#   home/master_bath/motion1
#     {"humidity":"61.00","temperature":"73.00","heatIndex":"72.87",...}
# The real fix is reflashing the sketch to emit "°F"; then delete this block.
#
# unique_id matches the discovery uniq_id ON PURPOSE so these adopt the existing
# registry entries and keep sensor.master_bath1_temperature etc. rather than
# landing as ..._2 and breaking every dashboard reference. Consequence: once the
# firmware is fixed, the now-valid discovery message collides on unique_id, HA
# logs a duplicate-id error and ignores the discovered entity — nothing breaks,
# but the firmware fix appears to do nothing until this block is removed.
#
# The templates guard the 2147483648 DHT read-failure sentinel, which
# laundry_room emits constantly and any node can emit transiently.
# ---------------------------------------------------------------------------

sensor:
  - name: "master_bath1 Temperature"
    unique_id: master_bath1_temp
    state_topic: "home/master_bath/motion1"
    device_class: temperature
    unit_of_measurement: "°F"
    value_template: "{{ value_json.temperature | float | round(1) }}"
    availability:
      - topic: "home/master_bath/motion1"
        value_template: >-
          {{ 'online' if -60 < (value_json.temperature | float(-999)) < 160 else 'offline' }}

  - name: "master_hall Temperature"
    unique_id: master_hall_temp
    state_topic: "home/master_hall/motion"
    device_class: temperature
    unit_of_measurement: "°F"
    value_template: "{{ value_json.temperature | float | round(1) }}"
    availability:
      - topic: "home/master_hall/motion"
        value_template: >-
          {{ 'online' if -60 < (value_json.temperature | float(-999)) < 160 else 'offline' }}

  - name: "master_closet1 Temperature"
    unique_id: master_closet1_temp
    state_topic: "home/master_closet/motion1"
    device_class: temperature
    unit_of_measurement: "°F"
    value_template: "{{ value_json.temperature | float | round(1) }}"
    availability:
      - topic: "home/master_closet/motion1"
        value_template: >-
          {{ 'online' if -60 < (value_json.temperature | float(-999)) < 160 else 'offline' }}

  - name: "guest_bath Temperature"
    unique_id: guest_bath_temp
    state_topic: "home/guest_bath/motion"
    device_class: temperature
    unit_of_measurement: "°F"
    value_template: "{{ value_json.temperature | float | round(1) }}"
    availability:
      - topic: "home/guest_bath/motion"
        value_template: >-
          {{ 'online' if -60 < (value_json.temperature | float(-999)) < 160 else 'offline' }}

  - name: "entry1 Temperature"
    unique_id: entry1_temp
    state_topic: "home/entry/motion1"
    device_class: temperature
    unit_of_measurement: "°F"
    value_template: "{{ value_json.temperature | float | round(1) }}"
    availability:
      - topic: "home/entry/motion1"
        value_template: >-
          {{ 'online' if -60 < (value_json.temperature | float(-999)) < 160 else 'offline' }}

  # This node's DHT22 is dead — it publishes the 2147483648 sentinel for both
  # temperature and humidity. Defined for completeness; the availability guard
  # keeps it reading "unavailable" rather than a nonsense number, and it will
  # start working on its own if the sensor is ever replaced.
  - name: "laundry_room Temperature"
    unique_id: laundry_room_temp
    state_topic: "home/laundry_room/motion"
    device_class: temperature
    unit_of_measurement: "°F"
    value_template: "{{ value_json.temperature | float | round(1) }}"
    availability:
      - topic: "home/laundry_room/motion"
        value_template: >-
          {{ 'online' if -60 < (value_json.temperature | float(-999)) < 160 else 'offline' }}
