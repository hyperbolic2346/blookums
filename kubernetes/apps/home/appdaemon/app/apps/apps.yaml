Master Bath Fan:
  class: BathFan
  module: bath_fan
  fan: switch.master_bath_fan
  fan_sensor: sensor.master_bath1_humidity
  light: light.master_bath_shower
  override: input_boolean.master_fan_override
  # v3.0: run whenever this room is wetter than the rest of the house. NOT
  # master_hall/master_closet - the bathroom vents into both, so they track it
  # (corr 0.76 / 0.83; the closet reached 99%) and understate the gap exactly
  # when it matters. On 2026-08-17 at 15:00 the hall said +27pp, these said
  # +42pp. The median means one of them showering doesn't skew the baseline.
  reference_sensors:
    - sensor.guest_bath_humidity
    - sensor.entry1_humidity
  # Replayed over 4.8 days: 6.0h/day of fan, 15 runs, median 95min, 80% ending
  # because the gap actually closed. Gap percentiles were p25=14 p50=23 p75=32,
  # so +30 is a genuinely wet room, not the everyday baseline.
  # MIN, not median: with two sensors a median is just their average, so one
  # drifting sensor eats the gap. entry1 wandered 52->70% on the evening of
  # 2026-08-17 and left the fan idle at +28pp with the bathroom at 90%.
  reference_mode: min
  start_gap_pp: 35
  stop_gap_pp: 22
  # Everyday ending: 15min after you leave, provided the room is no longer badly
  # soaked. Above +25pp it keeps working instead of quitting with the mirror
  # fogged - that is exactly what the fixed 30min timer did on 2026-08-17.
  occupancy_entity: input_select.master_bathroom_occupancy
  # The rear zone sees people the occupancy helper misses (it called the room
  # Empty from 10:48-11:06 mid-shower on 2026-08-17 - it can't see through the
  # shower glass). Motion here restarts the tail, so a second person coming in
  # while someone is still showering doesn't leave a stale countdown running.
  presence_sensors:
    - binary_sensor.master_bath1_motion
  # Coming back through the door trips this first, which disarms the rear-sensor
  # tail restart - a re-entry must not extend the tail, only a wrong "Empty" may.
  entry_sensors:
    - binary_sensor.master_bath0_motion
  post_exit_minutes: 15
  soaked_gap_pp: 28
  min_runtime_minutes: 10
  # Backstop against hopeless runs only - this fan has a LONG LAG. On 2026-08-17
  # it sat flat at 90-91% for 30min, then fell to 73% over the next 30. A short
  # window would have killed it just before it worked. Only applies once the room
  # is empty, and any real progress re-anchors the clock.
  progress_check_minutes: 45
  progress_pp: 2
  stalled_cooldown_minutes: 90
  # The sensor stops transmitting when it saturates (44min of silence on
  # 2026-08-17 while pegged at 99%), so the loop must not be event-driven only.
  evaluate_seconds: 60
  # The capped runs cluster on hot afternoons when outdoor air is too wet for
  # the fan to win; stop and wait rather than exhaust conditioned air for hours.
  max_runtime_minutes: 240
  restart_cooldown_minutes: 30
  stale_sensor_minutes: 30
  # Manual override never auto-offs; nudge the phones instead of running all night.
  notify: mikeandjolei
  override_notify_minutes: 60
  # Dashboard button: guarantees at least 30min, then hands back to the
  # differential instead of switching off a room that is still at 99%.
  timed_button: input_button.master_bath_fan_timed
  timed_minutes: 30
  #Batteries:
  #class: Battery
  #module: battery
  #threshold: 20

Master Bath Occupancy:
  module: room_occupancy
  class: RoomOccupancy
  sensors:
    - entity: binary_sensor.upstairs_hall_motion
      zone: exterior
    - entity: binary_sensor.master_bath0_motion
      zone: boundary
    - entity: binary_sensor.master_bath1_motion
      zone: interior
  exit_grace_period: 240
  safety_timeout: 1800
  occupancy_entity: input_select.master_bathroom_occupancy
