---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stockpile-staging
resources:
  - ./config.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./ocirepository.yaml
  - ./refresh-cronjob.yaml
configMapGenerator:
  # The refresh's steps (refresh-cronjob.yaml). Flux substitution off: the
  # script holds shell dollar signs.
  - name: stockpile-staging-refresh
    files:
      - ./refresh/refresh.sh
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
