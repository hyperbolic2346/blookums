---
# The nightly refresh (stockpile#331): last night's production database into
# shadow staging, scrubbed BEFORE the staging app can see it. Steps in
# refresh/refresh.sh:
#
#   precheck (init)  staging's api image: staging mode present, and
#                    staging-scrub.js loads and refuses an unconfirmed run,
#                    before anything of production is read.
#   dump     (init)  production from a READ REPLICA, as the rehearsal's
#                    read-only role, to the pod's own disk.
#   restore  (init)  into the scratch database stockpile_staging_next, as the
#                    refresh role. The app's role can't open it.
#   migrate  (init)  staging's api image: prisma migrate deploy on the copy.
#   scrub    (init)  staging's api image: dist/tools/staging-scrub.js on the
#                    copy. Non-zero: nothing swapped, staging keeps
#                    yesterday's.
#   stop     (init)  staging's api and worker scaled to 0.
#   swap     (init)  the copy handed to the app's role and renamed into
#                    place, one transaction; yesterday's dropped. After any
#                    earlier failure it drops the scratch copy instead.
#   start    (main)  OUTBOUND_MODE checked, fresh Redis, api and worker up.
#
# Until `stop`, staging runs on yesterday's copy throughout. From `stop` on,
# `start` always brings it back (refresh.sh explains), unless the settings
# no longer say readonly.
#
# Ships SUSPENDED: the first copy is run by hand and its scrubbed output
# checked; then set suspend: false here (a PR) to make it nightly.
#
# Run it now:
#   kubectl -n stockpile-staging create job --from=cronjob/stockpile-staging-refresh refresh-now
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stockpile-staging-refresh
  annotations:
    # Shell variables below, never Flux's.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  # 03:40 America/New_York (07:40 or 08:40 UTC): the quiet hours, clear of
  # production's 00/06/12/18 UTC catalog syncs and the 05:10 drop-ship sweep.
  # The dump reads a replica, never the primary.
  schedule: "40 3 * * *"
  suspend: true
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      # Long enough to read the logs; the pod's disk (and anything left on
      # it) goes with it.
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stockpile-staging-refresh
        spec:
          restartPolicy: Never
          serviceAccountName: stockpile-staging-refresh
          enableServiceLinks: false
          imagePullSecrets:
            - name: stockpile-staging-ghcr-pull
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
                      # limited image and ephemeral storage
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values: ["wally"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # The api-image steps name the image in full, each with its own
            # marker, so image automation moves them with the api.
            - name: precheck
              image: ghcr.io/nerdbucketinc/stockpile-api:main-63ced11-b1184 # {"$imagepolicy": "flux-system:stockpile-api-staging"}
              command: ["sh", "/refresh/refresh.sh", "precheck"]
              envFrom:
                - configMapRef:
                    name: stockpile-staging-env
              securityContext: &appSecure
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources: &appResources
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts: &mounts
                - name: refresh
                  mountPath: /refresh
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
            - name: dump
              image: &pg docker.io/library/postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
              command: ["sh", "/refresh/refresh.sh", "dump"]
              env:
                - name: SOURCE_HOST
                  value: postgres-ro.databases.svc.cluster.local
                - name: SOURCE_DB
                  value: stockpile
                - name: SOURCE_USER
                  valueFrom:
                    secretKeyRef: {name: stockpile-staging-refresh, key: SOURCE_USER}
                - name: SOURCE_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: stockpile-staging-refresh, key: SOURCE_PASSWORD}
              securityContext: &secure
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources: &pgResources
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              volumeMounts: *mounts
            - name: restore
              image: *pg
              command: ["sh", "/refresh/refresh.sh", "restore"]
              env: &refreshLogin
                - name: REFRESH_USER
                  valueFrom:
                    secretKeyRef: {name: stockpile-staging-refresh, key: REFRESH_USER}
                - name: REFRESH_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: stockpile-staging-refresh, key: REFRESH_PASSWORD}
              securityContext: *secure
              resources: *pgResources
              volumeMounts: *mounts
            - name: migrate
              image: ghcr.io/nerdbucketinc/stockpile-api:main-63ced11-b1184 # {"$imagepolicy": "flux-system:stockpile-api-staging"}
              command: ["sh", "/refresh/refresh.sh", "migrate"]
              envFrom: &appEnv
                - configMapRef:
                    name: stockpile-staging-env
              env: &nextUrl
                - name: NEXT_DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: stockpile-staging-refresh, key: NEXT_DATABASE_URL}
              securityContext: *appSecure
              resources: *appResources
              volumeMounts: *mounts
            - name: scrub
              image: ghcr.io/nerdbucketinc/stockpile-api:main-63ced11-b1184 # {"$imagepolicy": "flux-system:stockpile-api-staging"}
              command: ["sh", "/refresh/refresh.sh", "scrub"]
              envFrom: *appEnv
              env: *nextUrl
              securityContext: *appSecure
              resources: *appResources
              volumeMounts: *mounts
            - name: stop
              image: &kubectl docker.io/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
              command: ["sh", "/refresh/refresh.sh", "stop"]
              env:
                - name: HOME
                  value: /tmp
              securityContext: *secure
              resources: &kubectlResources
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts: *mounts
            - name: swap
              image: *pg
              command: ["sh", "/refresh/refresh.sh", "swap"]
              env: *refreshLogin
              securityContext: *secure
              resources: *pgResources
              volumeMounts: *mounts
          containers:
            - name: start
              image: *kubectl
              command: ["sh", "/refresh/refresh.sh", "start"]
              env:
                - name: HOME
                  value: /tmp
              securityContext: *secure
              resources: *kubectlResources
              volumeMounts: *mounts
          volumes:
            - name: refresh
              configMap:
                name: stockpile-staging-refresh
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stockpile-staging-refresh
---
# Scale and restart this namespace's api, worker and Redis, see its pods,
# read staging's settings map. Nothing else, nowhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stockpile-staging-refresh
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["stockpile-staging-api", "stockpile-staging-worker", "stockpile-staging-redis"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["stockpile-staging-api", "stockpile-staging-worker"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["stockpile-staging-env"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stockpile-staging-refresh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stockpile-staging-refresh
subjects:
  - kind: ServiceAccount
    name: stockpile-staging-refresh
---
# The refresh reaches DNS, the database (replicas for the dump, the primary
# for the rest) and the Kubernetes API (scaling), nothing else; it accepts
# nothing but the node.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-staging-refresh
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: stockpile-staging-refresh
  ingress:
    - fromEntities:
        - host
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: databases
            cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
