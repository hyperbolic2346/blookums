---
# Ingress rules for the stockpile-staging pods, as production's
# (batcave/stockpile networkpolicy.yaml). Each policy selects one component
# of THIS release only.
#
# Sources:
#   host    - kubelet probes (the node the pod runs on)
#   ingress - the Cilium Gateway API proxy (kube-system/external), which is
#             how HTTPRoute traffic reaches the api, web and mail page
#
# Ingress only, like production: outside writes are stopped by the app's own
# guard (OUTBOUND_MODE=readonly), which lets GunBroker's and the
# distributors' reads through. The refresh job's pods also limit their egress
# (refresh-cronjob.yaml).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-staging-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile-staging
      app.kubernetes.io/controller: api
  ingress:
    - fromEntities:
        - host
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-staging-web
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile-staging
      app.kubernetes.io/controller: web
  ingress:
    - fromEntities:
        - host
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# The worker serves only its health port (8091) to the kubelet.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-staging-worker
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile-staging
      app.kubernetes.io/controller: worker
  ingress:
    - fromEntities:
        - host
---
# Redis is this release's api and worker's only.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-staging-redis
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile-staging
      app.kubernetes.io/controller: redis
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: stockpile-staging
            app.kubernetes.io/controller: api
        - matchLabels:
            app.kubernetes.io/instance: stockpile-staging
            app.kubernetes.io/controller: worker
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# The capture inbox: SMTP from this release's api and worker only; its web
# page through the gateway (basic auth in Mailpit itself). It sends nothing
# anywhere: no egress at all.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-staging-mailpit
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile-staging
      app.kubernetes.io/controller: mailpit
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: stockpile-staging
            app.kubernetes.io/controller: api
        - matchLabels:
            app.kubernetes.io/instance: stockpile-staging
            app.kubernetes.io/controller: worker
      toPorts:
        - ports:
            - port: "1025"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8025"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
