---
# Network rules for the stockpile-staging pods, modeled on production's
# (batcave/stockpile networkpolicy.yaml). Each policy selects one component
# of THIS release only.
#
# Sources:
#   host    - kubelet probes (the node the pod runs on)
#   ingress - the Cilium Gateway API proxies (kube-system external and internal), which is
#             how HTTPRoute traffic reaches the api, web and mail page
#
# Egress, unlike production: the api and the worker reach only DNS, the
# database primary, this release's Redis and Mailpit, (the api) Google's
# OAuth token endpoint for sign-in, and the sandbox checkouts' Authorize.net
# sandbox, EasyPost and EasyPost's label bucket (the worker quotes and checks
# payments; the staff api opens the card page and buys labels). Everything else
# on the internet is refused here, on top of the app's own guard
# (OUTBOUND_MODE=readonly), which still refuses Authorize.net's production host
# and a production EasyPost key: if the guard ever let a write through, it would
# have nowhere to go. Real
# GunBroker or distributor READS would need their hosts added to the api's
# and worker's toFQDNs; the fake GunBroker (stockpile#332) will be an
# in-namespace endpoint instead. The web pod holds no secret and no
# database login, so it keeps production's ingress-only policy. The refresh
# job's pods limit their own egress (refresh-cronjob.yaml).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-staging-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile-staging
      app.kubernetes.io/controller: api
  ingress:
    - fromEntities:
        - host
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # Cilium's DNS proxy learns the toFQDNs address below from these.
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: databases
            cnpg.io/cluster: postgres
            cnpg.io/instanceRole: primary
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: stockpile-staging
            app.kubernetes.io/controller: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: stockpile-staging
            app.kubernetes.io/controller: mailpit
      toPorts:
        - ports:
            - port: "1025"
              protocol: TCP
    # The fake GunBroker (stockpile#332), once it exists:
    # - toEndpoints:
    #     - matchLabels:
    #         app.kubernetes.io/instance: stockpile-staging
    #         app.kubernetes.io/controller: fake-gunbroker
    #   toPorts:
    #     - ports:
    #         - port: "8080"
    #           protocol: TCP
    # Google sign-in: the code-for-token exchange (stockpile auth.service).
    - toFQDNs:
        - matchName: oauth2.googleapis.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The sandbox checkouts: exactly the hosts the guard lets these writes reach
    # (stockpile outbound-policy.ts), in the same spellings as its label bucket.
    - toFQDNs:
        - matchName: apitest.authorize.net
        - matchName: api.easypost.com
        - matchName: easypost-files.s3.amazonaws.com
        - matchPattern: easypost-files.s3.*.amazonaws.com
        - matchPattern: easypost-files.s3-*.amazonaws.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-staging-web
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile-staging
      app.kubernetes.io/controller: web
  ingress:
    - fromEntities:
        - host
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# The worker serves only its health port (8091) to the kubelet.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-staging-worker
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile-staging
      app.kubernetes.io/controller: worker
  ingress:
    - fromEntities:
        - host
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # Cilium's DNS proxy learns the toFQDNs addresses below from these.
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: databases
            cnpg.io/cluster: postgres
            cnpg.io/instanceRole: primary
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: stockpile-staging
            app.kubernetes.io/controller: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: stockpile-staging
            app.kubernetes.io/controller: mailpit
      toPorts:
        - ports:
            - port: "1025"
              protocol: TCP
    # The fake GunBroker (stockpile#332), once it exists:
    # - toEndpoints:
    #     - matchLabels:
    #         app.kubernetes.io/instance: stockpile-staging
    #         app.kubernetes.io/controller: fake-gunbroker
    #   toPorts:
    #     - ports:
    #         - port: "8080"
    #           protocol: TCP
    # The sandbox checkouts: exactly the hosts the guard lets these writes reach
    # (stockpile outbound-policy.ts), in the same spellings as its label bucket.
    - toFQDNs:
        - matchName: apitest.authorize.net
        - matchName: api.easypost.com
        - matchName: easypost-files.s3.amazonaws.com
        - matchPattern: easypost-files.s3.*.amazonaws.com
        - matchPattern: easypost-files.s3-*.amazonaws.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# The online store's public api: accepts only the storefront pods (and the
# kubelet's probes), and talks only to Postgres. DNS is how it finds Postgres.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-staging-storefront-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile-staging
      app.kubernetes.io/controller: storefront-api
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: stockpile-staging
            app.kubernetes.io/controller: storefront
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: databases
            cnpg.io/cluster: postgres
            cnpg.io/instanceRole: primary
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# The online store: reached through the gateway, and talks only to the public
# api. It holds no secret and no database login.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-staging-storefront
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile-staging
      app.kubernetes.io/controller: storefront
  ingress:
    - fromEntities:
        - host
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: stockpile-staging
            app.kubernetes.io/controller: storefront-api
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# Redis is this release's api and worker's only.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-staging-redis
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile-staging
      app.kubernetes.io/controller: redis
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: stockpile-staging
            app.kubernetes.io/controller: api
        - matchLabels:
            app.kubernetes.io/instance: stockpile-staging
            app.kubernetes.io/controller: worker
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# The capture inbox: SMTP from this release's api and worker only; its web
# page through the gateway (basic auth in Mailpit itself). It sends nothing
# anywhere: no egress at all.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stockpile-staging-mailpit
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: stockpile-staging
      app.kubernetes.io/controller: mailpit
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: stockpile-staging
            app.kubernetes.io/controller: api
        - matchLabels:
            app.kubernetes.io/instance: stockpile-staging
            app.kubernetes.io/controller: worker
      toPorts:
        - ports:
            - port: "1025"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8025"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
