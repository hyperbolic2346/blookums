---
# Staging's settings, in ONE place: every container that runs the Stockpile
# api image here (the api, its init steps, the worker, the refresh's
# migrate and scrub steps) loads this whole map through envFrom, so none
# of them can run without OUTBOUND_MODE=readonly. The online store's public
# api can't load all of it (it refuses to boot with a setting it doesn't
# read), so it takes OUTBOUND_MODE and STOCKPILE_ENV from this map by name.
# The api, the worker and the public api also refuse to start unless it reads
# exactly that (their commands, in helmrelease.yaml), and the app refuses to
# boot in staging without it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stockpile-staging-env
  namespace: stockpile-staging
data:
  STOCKPILE_ENV: staging
  # stockpile#329: every outside write refused before it is sent.
  OUTBOUND_MODE: readonly
  # Repeating jobs on top of the defaults, which touch staging's own database
  # only (channel policy, housekeeping, the storefront listing: stockpile
  # docs/staging.md). Only what a website checkout needs: its live rates and
  # payment links, and the check of a payment whose return was lost. Both go out
  # only to Authorize.net's sandbox and EasyPost with a test key, the two the
  # guard lets a write reach. Plus GunBroker's listing and order polls, which
  # only ever reach the fake below. No catalog syncs, no email.
  STAGING_SCHEDULES: "storefront-checkout,payment-links,gunbroker"
  # Email to the capture inbox (mailpit in helmrelease.yaml), never a
  # recipient.
  OUTBOUND_MAIL_CAPTURE: "smtp://stockpile-staging-mailpit.stockpile-staging.svc.cluster.local:1025"
  REDIS_URL: "redis://stockpile-staging-redis.stockpile-staging.svc.cluster.local:6379"
  # Staging's own key id for anything sealed here (externalsecret.yaml).
  SECRETS_ENCRYPTION_PRIMARY_ID: staging
  # Auto-list off as well: its writes would be refused anyway.
  DROPSHIP_AUTOLIST: "off"
  # The fake GunBroker (stockpile#332, docs/fake-gunbroker.md). Every GunBroker
  # call goes here, whatever the account's sandbox switch says; a real
  # gunbroker.com host is refused. The keys are invented: the fake only checks
  # that one is sent.
  GUNBROKER_API_BASE: "http://stockpile-staging-fake-gunbroker.stockpile-staging.svc.cluster.local:8080"
  GB_DEV_KEY: "staging-invented-dev-key"
  GB_SANDBOX_DEV_KEY: "staging-invented-dev-key"
  # Prisma's update check calls the internet, which egress refuses here.
  CHECKPOINT_DISABLE: "1"
  PRISMA_HIDE_UPDATE_MESSAGE: "1"
