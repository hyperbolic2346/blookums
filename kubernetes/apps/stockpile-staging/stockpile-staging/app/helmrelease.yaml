# Stockpile SHADOW STAGING (stockpile#331, epic #328): main's images on
# last night's production data, scrubbed, with every outside write refused.
#
#   - Data: every night the CronJob stockpile-staging-refresh builds a
#     scrubbed copy of production in a scratch database the app cannot
#     open, then swaps it in (refresh-cronjob.yaml, refresh/refresh.sh).
#   - Writes: OUTBOUND_MODE=readonly (stockpile#329), from config.yaml,
#     which every container here loads. The api and the worker refuse to
#     start without it (their commands check it first), and the app refuses
#     to boot in staging without it. Email goes to the Mailpit capture below.
#   - Reach: the app, its mail page and the online store are on the internal
#     gateway only.
#   - Egress: the api and worker reach only DNS, the database, their Redis,
#     Mailpit, Google's token endpoint (sign-in), and the sandbox checkouts'
#     Authorize.net sandbox and EasyPost; no other internet
#     (networkpolicy.yaml), on top of the app's guard.
#   - Credentials: staging's own 1Password item, role, key, Redis and
#     hostname. The copy's stored plugin credentials are sealed under
#     production's key, which staging never has; the scrub deletes them.
#   - Repeating jobs: the defaults, plus what a website checkout needs
#     (STAGING_SCHEDULES, config.yaml).
#   - Online store (stockpile docs/storefront.md): built to the shape production
#     will use. The storefront pod talks only to the public api; the public api
#     runs as its own restricted role, takes no staff setting, has no route of
#     its own, and talks only to Postgres. The checkout's outside calls are the
#     worker's and the staff api's. What the nightly copy can't carry is put back
#     on every api start (03-storefront-role, 04-sandbox-setup).
#
# Pods stay off wally (small image disk) and the control plane.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stockpile-staging
  namespace: stockpile-staging
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: stockpile-staging
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: stockpile-staging-ghcr-pull
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["wally"]
    controllers:
      api:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # CoreDNS autopath answers the first search-path lookup itself, so with
          # ndots:5 Cilium files the address under <name>.<namespace>.svc.cluster.local
          # and the toFQDNs rules in networkpolicy.yaml never match: every outside
          # call times out, "Policy denied". ndots:1 asks for the real name first.
          # Everything in the cluster is named here with a full *.svc.cluster.local.
          dnsConfig: &fqdnDns
            options:
              - name: ndots
                value: "1"
          terminationGracePeriodSeconds: 30
        initContainers:
          # Nothing runs, migrations included, on an image without staging
          # mode (STAGING_LOGIN_TOKEN, STAGING_SCHEDULES): a cheap look for
          # the names in its build.
          00-staging-image:
            image: &apiImage
              repository: ghcr.io/nerdbucketinc/stockpile-api
              tag: main-f7779aa-b1281 # {"$imagepolicy": "flux-system:stockpile-api-staging:tag"}
            command:
              - sh
              - -c
              - >-
                { grep -rqs -e STAGING_LOGIN_TOKEN dist && grep -rqs -e STAGING_SCHEDULES dist || { echo 'Refusing to start: this image has no staging mode (STAGING_LOGIN_TOKEN / STAGING_SCHEDULES); it needs a Stockpile main build that ships it.' >&2; exit 1; }; } && echo 'staging mode present'
          # The database and its role are CNPG objects
          # (databases/cloudnative-pg/stockpile-staging): no superuser login
          # in this namespace. The refresh migrates each night's copy before
          # swapping it in; this catches main moving during the day.
          01-migrate:
            image: *apiImage
            command: ["npx", "prisma", "migrate", "deploy"]
            envFrom: &envFrom
              - configMapRef:
                  name: stockpile-staging-env
              - secretRef:
                  name: stockpile-staging-secret
          # the seed (idempotent, additive)
          02-seed:
            image: *apiImage
            command: ["node", "dist/seed/main.js"]
            env:
              SUPER_ADMIN_EMAILS: "mike@batcaveballistics.com"
            envFrom: *envFrom
          # The online store's public role, right after migrate, on every start
          # (a refresh's copy comes with no grants; grants grow with features).
          # As the tables' owner: no superuser login in this namespace, so
          # --no-role-settings, and the role's statement_timeout is on its own
          # DATABASE_URL (externalsecret.yaml).
          03-storefront-role:
            image: *apiImage
            command:
              - node
              - dist/tools/apply-storefront-role.js
              - --role
              - stockpile_staging_public
              - --database
              - stockpile_staging
              - --no-role-settings
            envFrom: *envFrom
          # What the copy can't carry: the storefront module, the site's host
          # connected, the ship-to answer, and the sandbox gateway's and test
          # carrier's keys, sealed under staging's key (stockpile docs/staging.md).
          # The worker's minute sweep builds the listing from there. The keys are
          # mounted here and nowhere else.
          04-sandbox-setup:
            image: *apiImage
            command: ["node", "dist/tools/staging-sandbox-setup.js", "--confirm-staging-sandbox", "--shop", "bat-cave-ballistics"]
            env:
              STAGING_SHOP_HOST: "stockpile-staging-shop.${SECRET_DOMAIN}"
            envFrom:
              - configMapRef:
                  name: stockpile-staging-env
              - secretRef:
                  name: stockpile-staging-secret
              - secretRef:
                  name: stockpile-staging-sandbox-secret
        containers:
          main:
            image: *apiImage
            # Fail closed: no start unless the image has staging mode and
            # OUTBOUND_MODE is exactly readonly (and STOCKPILE_ENV staging).
            # Checked in this container's own environment, so a change that
            # drops either can't slip by.
            command:
              - sh
              - -c
              - >-
                { grep -rqs -e STAGING_LOGIN_TOKEN dist && grep -rqs -e STAGING_SCHEDULES dist || { echo 'Refusing to start: this image has no staging mode (STAGING_LOGIN_TOKEN / STAGING_SCHEDULES); it needs a Stockpile main build that ships it.' >&2; exit 1; }; } && node -e "if (process.env.OUTBOUND_MODE !== 'readonly' || process.env.STOCKPILE_ENV !== 'staging') { console.error('Refusing to start: staging needs OUTBOUND_MODE=readonly and STOCKPILE_ENV=staging (stockpile#331).'); process.exit(1); }" && exec node dist/main.js
            env:
              # The staff api; required in production from stockpile#752.
              API_MODE: "staff"
              API_PORT: "8000"
              AUTH_CALLBACK_URL: "https://stockpile-staging.${SECRET_DOMAIN}/api/auth/google/callback"
              AUTH_SECURE_COOKIES: "true"
              AUTH_REQUIRE_STRONG_SECRET: "true"
              AUTH_POST_LOGIN_REDIRECT: "/"
              DEFAULT_TENANT: "bat-cave-ballistics"
              SUPER_ADMIN_EMAILS: "mike@batcaveballistics.com"
            envFrom: *envFrom
            probes:
              liveness: &apiProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 8000
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/ready
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 2
              startup:
                enabled: false
            resources:
              requests:
                cpu: 25m
                memory: 192Mi
              limits:
                memory: 512Mi
      worker:
        annotations:
          reloader.stakater.com/auto: "true"
        # One worker runs every job family (staging's load is small).
        strategy: Recreate
        pod:
          dnsConfig: *fqdnDns
          terminationGracePeriodSeconds: 30
        containers:
          main:
            image: *apiImage
            command:
              - sh
              - -c
              - >-
                { grep -rqs -e STAGING_LOGIN_TOKEN dist && grep -rqs -e STAGING_SCHEDULES dist || { echo 'Refusing to start: this image has no staging mode (STAGING_LOGIN_TOKEN / STAGING_SCHEDULES); it needs a Stockpile main build that ships it.' >&2; exit 1; }; } && node -e "if (process.env.OUTBOUND_MODE !== 'readonly' || process.env.STOCKPILE_ENV !== 'staging') { console.error('Refusing to start: staging needs OUTBOUND_MODE=readonly and STOCKPILE_ENV=staging (stockpile#331).'); process.exit(1); }" && exec node dist/worker/main.js
            # WORKER_FAMILIES unset: this one worker runs every job family.
            env:
              # The checkout's payment links are made here, on the staff api's
              # address (stockpile apiPublicBase). Unset, a link would point at
              # localhost.
              AUTH_CALLBACK_URL: "https://stockpile-staging.${SECRET_DOMAIN}/api/auth/google/callback"
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8091
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 4
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8091
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 192Mi
              limits:
                memory: 768Mi
      web:
        strategy: RollingUpdate
        rollingUpdate:
          surge: 1
          unavailable: 0
        containers:
          main:
            image:
              repository: ghcr.io/nerdbucketinc/stockpile-web
              tag: main-f7779aa-b1281 # {"$imagepolicy": "flux-system:stockpile-web-staging:tag"}
            env:
              PUBLIC_API_URL: "https://stockpile-staging.${SECRET_DOMAIN}"
              PORT: "3000"
              # No Umami: staging's visits stay out of prod's stats.
            probes:
              liveness: &webProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *webProbe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 192Mi
      # The online store's public api (stockpile API_MODE=public): the same image,
      # only /api/storefront and the health checks, reachable only from the
      # storefront pods (networkpolicy.yaml), no HTTPRoute. It refuses to boot
      # with any setting it doesn't read, so no envFrom of staging's whole map or
      # the staff Secret; enableServiceLinks off for the same reason. Readiness
      # refuses a role that can read too much or misses a grant (a LIMIT 0 of
      # every granted table). The refresh stops it before the swap: a session on
      # the database refuses the rename.
      storefront-api:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        rollingUpdate:
          surge: 1
          unavailable: 0
        pod:
          enableServiceLinks: false
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 30
        containers:
          main:
            image: *apiImage
            # The same start check as the api's and the worker's.
            command:
              - sh
              - -c
              - >-
                { grep -rqs -e STAGING_LOGIN_TOKEN dist && grep -rqs -e STAGING_SCHEDULES dist || { echo 'Refusing to start: this image has no staging mode (STAGING_LOGIN_TOKEN / STAGING_SCHEDULES); it needs a Stockpile main build that ships it.' >&2; exit 1; }; } && node -e "if (process.env.OUTBOUND_MODE !== 'readonly' || process.env.STOCKPILE_ENV !== 'staging' || process.env.API_MODE !== 'public') { console.error('Refusing to start: the public api needs OUTBOUND_MODE=readonly, STOCKPILE_ENV=staging and API_MODE=public (stockpile#331, #742).'); process.exit(1); }" && exec node dist/main.js
            env:
              API_MODE: "public"
              API_PORT: "8000"
              OUTBOUND_MODE:
                valueFrom:
                  configMapKeyRef:
                    name: stockpile-staging-env
                    key: OUTBOUND_MODE
              STOCKPILE_ENV:
                valueFrom:
                  configMapKeyRef:
                    name: stockpile-staging-env
                    key: STOCKPILE_ENV
            envFrom:
              - secretRef:
                  name: stockpile-staging-public-secret
            securityContext: &publicSecure
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            probes:
              liveness: *apiProbe
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/ready
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  # Once a minute this walks every column the role can see.
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: false
            resources:
              requests:
                cpu: 25m
                memory: 192Mi
              limits:
                memory: 512Mi
      # The online store itself: the web image's second app, its shop found by
      # the host alone. Talks only to the public api; holds no secret or login.
      storefront:
        strategy: RollingUpdate
        rollingUpdate:
          surge: 1
          unavailable: 0
        pod:
          enableServiceLinks: false
          automountServiceAccountToken: false
        containers:
          main:
            # Its own marker, so image automation moves it with the web pod.
            image:
              repository: ghcr.io/nerdbucketinc/stockpile-web
              tag: main-f7779aa-b1281 # {"$imagepolicy": "flux-system:stockpile-web-staging:tag"}
            command: ["node", "/repo/apps/storefront/build"]
            workingDir: /repo/apps/storefront
            env:
              STOREFRONT_API_URL: "http://stockpile-staging-storefront-api.stockpile-staging.svc.cluster.local:8000"
              PORT: "3000"
              # So a form posted from https://<host> matches its own origin.
              PROTOCOL_HEADER: x-forwarded-proto
            securityContext: *publicSecure
            probes:
              liveness: &storefrontProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *storefrontProbe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 192Mi
      # Its own ephemeral Redis: no BullMQ job crosses from production. The
      # refresh restarts it, so no job from yesterday's copy survives.
      redis:
        containers:
          main:
            image:
              repository: public.ecr.aws/docker/library/redis
              tag: 8-alpine
            command: ["redis-server", "--save", "", "--appendonly", "no"]
            probes:
              liveness: &redisProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6379
                  initialDelaySeconds: 5
                  periodSeconds: 20
              readiness: *redisProbe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
      # The capture inbox (stockpile#329 OUTBOUND_MAIL_CAPTURE): every email
      # staging "sends" lands here, addressed to a .invalid envelope, and
      # nowhere else. In memory; the newest 500 kept. Its web page is behind
      # basic auth (MP_UI_AUTH, from the 1Password item).
      mailpit:
        containers:
          main:
            image:
              repository: docker.io/axllent/mailpit
              tag: v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
            env:
              MP_SMTP_BIND_ADDR: "0.0.0.0:1025"
              MP_UI_BIND_ADDR: "0.0.0.0:8025"
              MP_MAX_MESSAGES: "500"
              MP_UI_AUTH:
                valueFrom:
                  secretKeyRef:
                    name: stockpile-staging-mailpit
                    key: MP_UI_AUTH
            probes:
              liveness: &mailProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 1025
                  initialDelaySeconds: 5
                  periodSeconds: 20
              readiness: *mailProbe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
      # The fake GunBroker (stockpile#332): every answer invented, state in
      # memory, so a restart starts it empty. It calls nothing.
      fake-gunbroker:
        containers:
          main:
            image:
              repository: ghcr.io/nerdbucketinc/stockpile-fake-gunbroker
              tag: main-f7779aa-b1281 # {"$imagepolicy": "flux-system:stockpile-fake-gunbroker-staging:tag"}
            env:
              FAKE_GUNBROKER_ADMIN_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: stockpile-staging-fake-gunbroker
                    key: FAKE_GUNBROKER_ADMIN_TOKEN
            probes:
              liveness: &fakeProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 3
                  periodSeconds: 20
              readiness: *fakeProbe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      api:
        controller: api
        ports:
          http:
            port: 8000
      web:
        controller: web
        ports:
          http:
            port: 3000
      # Cluster-internal: the storefront pods' way in, never a gateway's.
      storefront-api:
        controller: storefront-api
        ports:
          http:
            port: 8000
      storefront:
        controller: storefront
        ports:
          http:
            port: 3000
      redis:
        controller: redis
        ports:
          redis:
            port: 6379
      mailpit:
        controller: mailpit
        ports:
          http:
            port: 8025
          smtp:
            port: 1025
      fake-gunbroker:
        controller: fake-gunbroker
        ports:
          http:
            port: 8080
    route:
      # INTERNAL gateway (home network) until the first scrubbed copy has
      # been checked. To publish it: parentRefs name external (sectionName
      # https stays); the wildcard DNS and tunnel entries already cover the
      # name.
      app:
        hostnames: ["stockpile-staging.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs:
              - identifier: api
                port: 8000
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: web
                port: 3000
      # The online store: internal gateway (home network) only. Every path to
      # the storefront pods; the public api has no route. Its one domain is the
      # gateway's wildcard certificate, unlike production's one per shop.
      # Connected by 04-sandbox-setup (STAGING_SHOP_HOST above).
      storefront:
        hostnames: ["stockpile-staging-shop.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: storefront
                port: 3000
      # The fake GunBroker's admin door, for the end-to-end suite: internal gateway
      # only, behind its own bearer token.
      fake-gunbroker:
        hostnames: ["stockpile-staging-fake-gb.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: fake-gunbroker
                port: 8080
      # The capture inbox's page: internal gateway (home network) only,
      # behind Mailpit's own basic auth as well.
      mail:
        hostnames: ["stockpile-staging-mail.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: mailpit
                port: 8025
