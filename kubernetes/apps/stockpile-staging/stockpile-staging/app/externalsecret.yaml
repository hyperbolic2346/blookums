---
# Staging's app secrets, from its OWN 1Password item "stockpile-staging"
# (K8s vault). Nothing here is production's: its own database role, session
# secret, secrets-encryption key and staging login token. No distributor or
# marketplace credentials: the catalog comes with the nightly copy, and the
# copy's stored plugin credentials are sealed under production's key, which
# staging never has (the scrub deletes them anyway).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stockpile-staging
  namespace: stockpile-staging
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: stockpile-staging-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Its own role, its own database (databases/cloudnative-pg: the
        # role's pg_hba lines admit it to stockpile_staging and nothing
        # else). TimeZone=UTC as production's (stockpile#708).
        DATABASE_URL: "postgresql://stockpile_staging:{{ .POSTGRES_PASS }}@postgres-rw.databases.svc.cluster.local:5432/stockpile_staging?sslmode=disable&options=-c%20TimeZone%3DUTC"
        # Session signing. The app reads AUTH_SESSION_SECRET (as production);
        # SESSION_SECRET carries the same value for tooling that names it so.
        AUTH_SESSION_SECRET: "{{ .AUTH_SESSION_SECRET }}"
        SESSION_SECRET: "{{ .AUTH_SESSION_SECRET }}"
        GOOGLE_CLIENT_ID: "{{ .GOOGLE_CLIENT_ID }}"
        GOOGLE_CLIENT_SECRET: "{{ .GOOGLE_CLIENT_SECRET }}"
        AUTH_ALLOWED_EMAILS: "{{ .AUTH_ALLOWED_EMAILS }}"
        # Staging's own key (never production's): production's stored
        # credentials can't be opened here. The ring carries it under
        # "default" (the app requires that) and "staging" (what it writes
        # under: SECRETS_ENCRYPTION_PRIMARY_ID in config.yaml), so anything
        # sealed in staging is told apart from what came with the copy.
        SECRETS_ENCRYPTION_KEY: "{{ .SECRETS_ENCRYPTION_KEY }}"
        SECRETS_ENCRYPTION_KEYS: '{"default":"{{ .SECRETS_ENCRYPTION_KEY }}","staging":"{{ .SECRETS_ENCRYPTION_KEY }}"}'
        # Sign-in for the scrub's test users (stockpile#331), staging only.
        STAGING_LOGIN_TOKEN: "{{ .STAGING_LOGIN_TOKEN }}"
  data:
    - secretKey: POSTGRES_PASS
      remoteRef: {key: stockpile-staging, property: POSTGRES_PASS}
    - secretKey: AUTH_SESSION_SECRET
      remoteRef: {key: stockpile-staging, property: AUTH_SESSION_SECRET}
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef: {key: stockpile-staging, property: GOOGLE_CLIENT_ID}
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef: {key: stockpile-staging, property: GOOGLE_CLIENT_SECRET}
    - secretKey: AUTH_ALLOWED_EMAILS
      remoteRef: {key: stockpile-staging, property: AUTH_ALLOWED_EMAILS}
    - secretKey: SECRETS_ENCRYPTION_KEY
      remoteRef: {key: stockpile-staging, property: SECRETS_ENCRYPTION_KEY}
    - secretKey: STAGING_LOGIN_TOKEN
      remoteRef: {key: stockpile-staging, property: STAGING_LOGIN_TOKEN}
---
# The nightly refresh's two logins, each mounted only into the steps that
# use it (refresh-cronjob.yaml):
#   - SOURCE: the migration rehearsal's READ-ONLY role stockpile_rehearsal
#     (databases/cloudnative-pg, managed role: SELECT on the stockpile
#     database only, admitted to that one database from a pod address,
#     connection limit 2), password from the 1Password item "ci". Used
#     against a replica only.
#   - REFRESH: staging's refresh role stockpile_staging_refresh, admitted
#     only to the staging databases and the maintenance database, never to
#     stockpile. Builds the scratch copy and swaps it in.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stockpile-staging-refresh
  namespace: stockpile-staging
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: stockpile-staging-refresh
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SOURCE_USER: stockpile_rehearsal
        SOURCE_PASSWORD: "{{ .rehearsal_db_password }}"
        REFRESH_USER: stockpile_staging_refresh
        REFRESH_PASSWORD: "{{ .REFRESH_POSTGRES_PASS }}"
        # The scratch copy, for the app image's migrate step. Environment
        # only, never argv.
        # Never the app's own DATABASE_URL: the app role cannot open it.
        NEXT_DATABASE_URL: "postgresql://stockpile_staging_refresh:{{ .REFRESH_POSTGRES_PASS }}@postgres-rw.databases.svc.cluster.local:5432/stockpile_staging_next?sslmode=disable&options=-c%20TimeZone%3DUTC"
        # The same, for the scrub tool (SCRUB_DATABASE_URL in its env): its
        # path must be exactly /<dbname>, nothing %-encoded.
        SCRUB_DATABASE_URL: "postgresql://stockpile_staging_refresh:{{ .REFRESH_POSTGRES_PASS }}@postgres-rw.databases.svc.cluster.local:5432/stockpile_staging_next?sslmode=disable"
  data:
    - secretKey: rehearsal_db_password
      remoteRef: {key: ci, property: rehearsal_db_password}
    - secretKey: REFRESH_POSTGRES_PASS
      remoteRef: {key: stockpile-staging, property: REFRESH_POSTGRES_PASS}
---
# The capture inbox's web page login ("user:password").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stockpile-staging-mailpit
  namespace: stockpile-staging
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: stockpile-staging-mailpit
    creationPolicy: Owner
  data:
    - secretKey: MP_UI_AUTH
      remoteRef: {key: stockpile-staging, property: MAILPIT_UI_AUTH}
---
# Pull secret for the private GHCR images: a GitHub PAT with read:packages,
# in the "stockpile-staging" item (GHCR_USER / GHCR_TOKEN).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stockpile-staging-ghcr
  namespace: stockpile-staging
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: stockpile-staging-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .GHCR_USER .GHCR_TOKEN | b64enc }}"}}}
  data:
    - secretKey: GHCR_USER
      remoteRef: {key: stockpile-staging, property: GHCR_USER}
    - secretKey: GHCR_TOKEN
      remoteRef: {key: stockpile-staging, property: GHCR_TOKEN}
