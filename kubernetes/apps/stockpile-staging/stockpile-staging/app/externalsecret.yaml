---
# Staging's app config, from its OWN 1Password item "stockpile-staging"
# (K8s vault). Nothing here is production's: its own database role, session
# secret and secrets-encryption key. No distributor or marketplace
# credentials at all — the catalog comes with the nightly copy, and a shop's
# accounts are connected inside staging (sealed under staging's key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stockpile-staging
  namespace: stockpile-staging
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: stockpile-staging-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-rw.databases.svc.cluster.local:5432/stockpile_staging?sslmode=disable"
        AUTH_SESSION_SECRET: "{{ .AUTH_SESSION_SECRET }}"
        GOOGLE_CLIENT_ID: "{{ .GOOGLE_CLIENT_ID }}"
        GOOGLE_CLIENT_SECRET: "{{ .GOOGLE_CLIENT_SECRET }}"
        AUTH_ALLOWED_EMAILS: "{{ .AUTH_ALLOWED_EMAILS }}"
        # Staging's own key (never production's): production's stored
        # credentials can't be opened here. The ring carries it under
        # "default" (the app requires that) and "staging" (what it writes
        # under: SECRETS_ENCRYPTION_PRIMARY_ID in the HelmRelease).
        SECRETS_ENCRYPTION_KEY: "{{ .SECRETS_ENCRYPTION_KEY }}"
        SECRETS_ENCRYPTION_KEYS: '{"default":"{{ .SECRETS_ENCRYPTION_KEY }}","staging":"{{ .SECRETS_ENCRYPTION_KEY }}"}'
  dataFrom:
    - extract:
        key: stockpile-staging
---
# Postgres init: creates the stockpile_staging database and its role on the
# shared cluster. Mounted only into the api's 01-init-db init container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stockpile-staging-db-init
  namespace: stockpile-staging
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: stockpile-staging-db-init
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_DBNAME: stockpile_staging
        INIT_POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: stockpile-staging
    - extract:
        key: cloudnative-pg
---
# The nightly refresh's two logins, each mounted only into its own step:
#   - the copy's source: the migration rehearsal's READ-ONLY role
#     stockpile_rehearsal (databases/cloudnative-pg, managed role; SELECT on
#     the stockpile database only, from a pod address, a connection limit of
#     2), password from the 1Password item "ci";
#   - the restore's target: staging's own role, which owns stockpile_staging.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stockpile-staging-refresh
  namespace: stockpile-staging
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: stockpile-staging-refresh
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SOURCE_USER: stockpile_rehearsal
        SOURCE_PASSWORD: "{{ .rehearsal_db_password }}"
        TARGET_USER: "{{ .POSTGRES_USER }}"
        TARGET_PASSWORD: "{{ .POSTGRES_PASS }}"
  data:
    - secretKey: rehearsal_db_password
      remoteRef:
        key: ci
        property: rehearsal_db_password
    - secretKey: POSTGRES_USER
      remoteRef:
        key: stockpile-staging
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASS
      remoteRef:
        key: stockpile-staging
        property: POSTGRES_PASS
---
# The capture inbox's web page login ("user:password").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stockpile-staging-mailpit
  namespace: stockpile-staging
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: stockpile-staging-mailpit
    creationPolicy: Owner
  data:
    - secretKey: MP_UI_AUTH
      remoteRef:
        key: stockpile-staging
        property: MAILPIT_UI_AUTH
---
# Pull secret for the private GHCR images: a GitHub PAT with read:packages,
# in the "stockpile-staging" item (GHCR_USER / GHCR_TOKEN).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stockpile-staging-ghcr
  namespace: stockpile-staging
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: stockpile-staging-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .GHCR_USER .GHCR_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: stockpile-staging
